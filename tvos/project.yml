# XcodeGen spec — regenerate the Xcode project with `xcodegen generate` (run from this dir).
# The .xcodeproj is NOT committed; project.yml is the source of truth.
name: TabloTV
options:
  bundleIdPrefix: com.mwgreen
  deploymentTarget:
    tvOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TA8B32D228  # Matt's personal (free) team; change to yours to build elsewhere
targets:
  TabloTV:
    type: application
    platform: tvOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Tablo
        # Versions live here: xcodegen regenerates Info.plist from this block.
        CFBundleShortVersionString: "1.1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        # The proxy is plain http on the LAN
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mwgreen.tablotv
        # Layered home-screen icon + Top Shelf, drawn by icon/make_icon.swift
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
