<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Tablo TV</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='%23e94560'/%3E%3C/svg%3E">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0c0e14;
      --surface: #13161f;
      --surface-2: #1a1e2b;
      --surface-3: #232838;
      --border: rgba(255,255,255,0.07);
      --text: #f2f3f7;
      --text-dim: #9aa0b0;
      --text-faint: #666d80;
      --accent: #e94560;
      --accent-soft: rgba(233,69,96,0.14);
      --radius: 10px;
      --header-h: 56px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    button { touch-action: manipulation; font-family: inherit; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ---------------- Header ---------------- */
    header {
      background: var(--surface); height: var(--header-h);
      padding: 0 max(20px, env(safe-area-inset-left)) 0 max(20px, env(safe-area-inset-right));
      display: flex; align-items: center; gap: 20px;
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: baseline; gap: 8px; }
    .brand h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .brand h1::before {
      content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent); margin-right: 8px; vertical-align: 1px;
      box-shadow: 0 0 8px rgba(233,69,96,0.7);
    }
    .brand .build { font-size: 10px; color: var(--text-faint); font-weight: 400; }
    header nav {
      display: flex; gap: 2px; background: var(--surface-2);
      padding: 3px; border-radius: 9px;
    }
    header nav button {
      background: none; border: none; color: var(--text-dim);
      padding: 6px 16px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600;
      transition: color 0.15s, background 0.15s;
    }
    header nav button:hover { color: var(--text); }
    header nav button.active { background: var(--surface-3); color: var(--text); }

    /* ---------------- Layout ---------------- */
    .container { display: flex; height: calc(100vh - var(--header-h)); }

    .sidebar {
      width: 340px; min-width: 340px; overflow-y: auto;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .sidebar-search {
      padding: 10px 12px; position: sticky; top: 0; background: var(--surface); z-index: 5;
      display: flex; gap: 8px; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-search input {
      flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 14px; outline: none; min-width: 0;
    }
    .sidebar-search input:focus { border-color: rgba(233,69,96,0.5); }
    .sidebar-search input::placeholder { color: var(--text-faint); }
    .gear-btn {
      background: none; border: none; color: var(--text-faint); font-size: 19px;
      cursor: pointer; padding: 6px; line-height: 1; border-radius: 6px;
    }
    .gear-btn:hover { color: var(--text); background: var(--surface-2); }

    /* ---------------- List items ---------------- */
    .channel-item, .recording-item {
      padding: 11px 14px; cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.12s;
      position: relative;
    }
    .channel-item:hover, .recording-item:hover { background: var(--surface-2); }
    .channel-item.active, .recording-item.active {
      background: var(--accent-soft); border-left-color: var(--accent);
    }
    .channel-number {
      display: inline-block; font-weight: 700; font-size: 12px; color: var(--accent);
      background: var(--accent-soft); border-radius: 5px; padding: 2px 7px;
      margin-right: 9px; font-variant-numeric: tabular-nums;
    }
    .channel-name { font-weight: 600; font-size: 14px; }
    .channel-now { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; padding-left: 2px; }

    .recording-title { font-weight: 600; font-size: 14px; padding-right: 72px; }
    .recording-episode { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
    .recording-meta { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; }
    .rec-actions {
      position: absolute; top: 8px; right: 8px; display: flex; gap: 2px;
    }
    .rec-delete-btn, .rec-stop-btn {
      color: var(--text-faint); font-size: 13px; cursor: pointer;
      padding: 6px 8px; line-height: 1; border-radius: 6px;
    }
    .rec-delete-btn:hover, .rec-stop-btn:hover { color: var(--accent); background: var(--surface-3); }
    .resume-bar {
      height: 3px; background: var(--surface-3); border-radius: 2px; margin-top: 7px; overflow: hidden;
    }
    .resume-bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

    .rec-live-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 700; color: #fff;
      background: var(--accent); padding: 2px 6px; border-radius: 4px;
      margin-right: 7px; letter-spacing: 0.6px; vertical-align: 1px;
    }
    .rec-live-badge::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%; background: #fff;
      animation: rec-pulse 1.5s ease-in-out infinite;
    }
    @keyframes rec-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .ch-rec-dot {
      color: var(--accent); font-size: 9.5px; font-weight: 800; margin-left: 7px;
      text-transform: uppercase; letter-spacing: 0.6px;
      animation: rec-pulse 1.5s ease-in-out infinite;
    }

    /* Local-archive badges + actions */
    .rec-saved-badge {
      display: inline-block; font-size: 10px; font-weight: 700; color: #2ecc71;
      background: rgba(46,204,113,0.14); padding: 2px 6px; border-radius: 4px;
      margin-right: 7px; letter-spacing: 0.6px; vertical-align: 1px;
    }
    .rec-arch-badge {
      display: inline-block; font-size: 10px; font-weight: 700; color: #f0b429;
      background: rgba(240,180,41,0.14); padding: 2px 6px; border-radius: 4px;
      margin-right: 7px; letter-spacing: 0.6px; vertical-align: 1px;
    }
    .rec-arch-badge.failed { color: var(--accent); background: var(--accent-soft); }
    .rec-archive-btn {
      color: var(--text-faint); font-size: 13px; cursor: pointer;
      padding: 6px 8px; line-height: 1; border-radius: 6px;
    }
    .rec-archive-btn:hover { color: #2ecc71; background: var(--surface-3); }

    /* Recordings view switcher (Date / Shows / A-Z) */
    #rec-view-bar { display: flex; gap: 5px; padding: 9px 10px 5px; }
    #rec-view-bar button {
      flex: 1; background: var(--surface-2); border: none; color: var(--text-dim);
      font-size: 12px; font-weight: 600; padding: 6px 0; border-radius: 6px; cursor: pointer;
    }
    #rec-view-bar button:hover { background: var(--surface-3); }
    #rec-view-bar button.active { background: var(--accent-soft); color: var(--accent); }

    /* Shows (grouped) view */
    .rec-group-header {
      padding: 10px 14px; cursor: pointer; font-weight: 700; font-size: 13.5px;
      display: flex; align-items: center; gap: 8px;
      border-left: 3px solid transparent;
    }
    .rec-group-header:hover { background: var(--surface-2); }
    .rec-group-header .chev {
      font-size: 9px; color: var(--text-faint); transition: transform 0.15s;
      flex-shrink: 0;
    }
    .rec-group.open .chev { transform: rotate(90deg); }
    .rec-group-header .g-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rec-group-header .count { color: var(--text-faint); font-weight: 600; font-size: 11px; white-space: nowrap; }
    .rec-group .rec-group-items { display: none; }
    .rec-group.open .rec-group-items { display: block; }
    .rec-group .rec-group-items.force-open { display: block; }
    .rec-group .recording-item { padding-left: 26px; }

    /* A-Z view letter headers */
    .rec-letter {
      padding: 8px 14px 3px; font-size: 11px; font-weight: 800; color: var(--text-faint);
      text-transform: uppercase; letter-spacing: 1px;
    }

    /* ---------------- Player area ---------------- */
    .player-area {
      flex: 1; display: flex; background: #000; position: relative; min-width: 0;
    }
    video { width: 100%; flex: 1; background: #000; min-height: 0; }

    .status, .loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: var(--text-faint); font-size: 15px; text-align: center; z-index: 5;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .status svg { width: 44px; height: 44px; opacity: 0.4; }
    .status.hidden, .loading.hidden { display: none; }
    .loading { color: var(--text-dim); }
    .loading .spinner, .buffering .spinner {
      width: 42px; height: 42px; border: 3px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .buffering {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      display: none; z-index: 10; pointer-events: none;
    }
    .buffering.visible { display: block; }
    .error-msg {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(20,10,14,0.92); border: 1px solid rgba(233,69,96,0.4);
      color: #ff8fa3; font-size: 13.5px; padding: 10px 16px; border-radius: 9px;
      max-width: 85%; text-align: center; z-index: 40; display: none;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .error-msg.visible { display: block; }
    .error-msg.info {
      border-color: rgba(255,255,255,0.18); color: #dfe3ec;
      background: rgba(16,18,26,0.92);
    }

    /* ---------------- Player UI overlay ---------------- */
    .player-ui {
      position: absolute; inset: 0; z-index: 20; display: none;
      pointer-events: none;
      opacity: 1; transition: opacity 0.25s ease;
    }
    .player-ui.visible { display: block; }
    .player-area.hide-ui .player-ui { opacity: 0; }
    .player-area.hide-ui { cursor: none; }
    .player-area.hide-ui .player-top,
    .player-area.hide-ui .player-bottom { pointer-events: none !important; }

    .player-top {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 14px max(18px, env(safe-area-inset-right)) 40px max(18px, env(safe-area-inset-left));
      background: linear-gradient(to bottom, rgba(0,0,0,0.72), rgba(0,0,0,0));
      pointer-events: auto;
    }
    .np-title { font-size: 15.5px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .np-sub { font-size: 12.5px; color: rgba(255,255,255,0.75); margin-top: 2px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

    .player-bottom {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 34px max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: linear-gradient(to top, rgba(0,0,0,0.82), rgba(0,0,0,0));
      pointer-events: auto;
      display: flex; flex-direction: column; gap: 4px;
    }

    /* ---- Seek bar ---- */
    .seek-row { display: flex; align-items: center; gap: 12px; }
    .time-label {
      font-size: 12.5px; color: rgba(255,255,255,0.85); font-variant-numeric: tabular-nums;
      white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,0.8); min-width: 40px;
    }
    .time-label.right { text-align: right; }
    .seek-wrap {
      flex: 1; height: 28px; position: relative; cursor: pointer;
      display: flex; align-items: center; touch-action: none;
    }
    .seek-track {
      width: 100%; height: 4px; background: rgba(255,255,255,0.22); border-radius: 2px;
      position: relative; overflow: hidden; transition: height 0.12s;
    }
    .seek-wrap:hover .seek-track, .seek-wrap.scrubbing .seek-track { height: 6px; }
    .seek-buffered {
      height: 100%; background: rgba(255,255,255,0.3); border-radius: 2px;
      position: absolute; left: 0; top: 0; width: 0;
    }
    .seek-fill {
      height: 100%; background: var(--accent); border-radius: 2px;
      position: absolute; left: 0; top: 0; width: 0;
    }
    .seek-thumb {
      position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%;
      background: #fff; transform: translate(-50%, -50%) scale(0);
      transition: transform 0.12s; pointer-events: none; z-index: 2;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .seek-wrap:hover .seek-thumb, .seek-wrap.scrubbing .seek-thumb { transform: translate(-50%, -50%) scale(1); }
    .seek-bubble {
      position: absolute; bottom: 26px; transform: translateX(-50%);
      background: rgba(12,14,20,0.92); color: #fff; font-size: 12px; font-weight: 600;
      padding: 4px 9px; border-radius: 6px; pointer-events: none;
      white-space: nowrap; display: none; font-variant-numeric: tabular-nums;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .seek-bubble.visible { display: block; }

    /* ---- Control buttons row ---- */
    .btn-row { display: flex; align-items: center; gap: 4px; }
    .btn-row .spacer { flex: 1; }
    .ctl {
      background: none; border: none; color: #fff; cursor: pointer;
      width: 42px; height: 42px; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      opacity: 0.92; transition: opacity 0.12s, background 0.12s;
    }
    .ctl:hover { opacity: 1; background: rgba(255,255,255,0.12); }
    .ctl svg { width: 24px; height: 24px; fill: currentColor; }
    .ctl.play-btn svg { width: 30px; height: 30px; }
    .ctl .icon-alt { display: none; }
    .ctl.hidden-btn { display: none; }

    #playpause.playing .icon-main { display: none; }
    #playpause.playing .icon-alt { display: block; }
    #muteBtn.muted .icon-main { display: none; }
    #muteBtn.muted .icon-alt { display: block; }
    #fullscreenBtn.fs .icon-main { display: none; }
    #fullscreenBtn.fs .icon-alt { display: block; }

    .live-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.14); border: none; color: rgba(255,255,255,0.85);
      font-size: 11.5px; font-weight: 800; letter-spacing: 0.8px;
      padding: 7px 12px; border-radius: 999px; cursor: pointer; margin-left: 8px;
      text-transform: uppercase; transition: background 0.15s, color 0.15s;
    }
    .live-btn .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.55);
      transition: background 0.15s;
    }
    .live-btn.at-live { background: var(--accent); color: #fff; }
    .live-btn.at-live .live-dot { background: #fff; animation: rec-pulse 1.6s ease-in-out infinite; }
    .live-btn:not(.at-live):hover { background: rgba(255,255,255,0.25); color: #fff; }
    .live-btn.hidden { display: none; }

    .ctl.rec-btn { color: rgba(255,255,255,0.6); }
    .ctl.rec-btn svg { width: 20px; height: 20px; }
    .ctl.rec-btn:hover { color: var(--accent); }
    .ctl.rec-btn.recording { color: var(--accent); }
    .ctl.rec-btn.recording svg { animation: rec-pulse 1.6s ease-in-out infinite; }
    .ctl.rec-btn.pending { color: var(--accent); opacity: 0.65; }
    .ctl.rec-btn.pending svg { animation: rec-pulse 0.7s ease-in-out infinite; }
    .ctl.rec-btn.hidden { display: none; }

    .volume-group { display: flex; align-items: center; }
    .volume-slider {
      width: 78px; height: 4px; cursor: pointer; margin-right: 6px;
      -webkit-appearance: none; appearance: none;
      background: rgba(255,255,255,0.25); border-radius: 2px; outline: none;
      accent-color: var(--accent);
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      background: #fff; border-radius: 50%; cursor: pointer;
    }
    @media (hover: none) {
      .volume-group { display: none; }   /* phones use hardware volume */
      #theaterBtn { display: none; }
      .seek-thumb { transform: translate(-50%, -50%) scale(1); }  /* always show on touch */
      .seek-track { height: 5px; }
    }

    /* Theater mode */
    body.theater .sidebar { display: none; }
    body.theater header { display: none; }
    body.theater .container { height: 100vh; height: 100dvh; }

    /* Fullscreen */
    .player-area:fullscreen, .player-area:-webkit-full-screen { background: #000; }
    .player-area:fullscreen video, .player-area:-webkit-full-screen video {
      width: 100%; height: 100%; object-fit: contain;
    }
    video:fullscreen, video:-webkit-full-screen {
      width: 100%; height: 100%; object-fit: contain;
    }

    /* ---------------- Modal ---------------- */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.72);
      z-index: 100; align-items: center; justify-content: center;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px; width: 500px; max-width: calc(100vw - 32px);
      max-height: 80vh; display: flex; flex-direction: column;
      box-shadow: 0 18px 50px rgba(0,0,0,0.6);
    }
    .modal h2 { font-size: 15px; margin-bottom: 12px; font-weight: 700; }
    .modal-search {
      width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 14px; margin-bottom: 10px; outline: none;
    }
    .modal-search:focus { border-color: rgba(233,69,96,0.5); }
    .modal-list { flex: 1; overflow-y: auto; max-height: 50vh; }
    .modal-ch {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      cursor: pointer; border-radius: 8px;
    }
    .modal-ch:hover { background: var(--surface-2); }
    .modal-ch input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
    .modal-ch .ch-num { font-weight: 700; color: var(--accent); min-width: 44px; font-size: 13px; font-variant-numeric: tabular-nums; }
    .modal-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
    .modal-actions button {
      padding: 7px 18px; border-radius: 8px; cursor: pointer; font-size: 13.5px; font-weight: 600;
      border: 1px solid var(--border); background: none; color: var(--text-dim);
    }
    .modal-actions button:hover { color: var(--text); background: var(--surface-2); }
    .modal-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .modal-actions button.primary:hover { background: #f05a73; }

    /* ---------------- Guide ---------------- */
    .guide-container {
      height: calc(100vh - var(--header-h)); overflow: hidden; display: flex; flex-direction: column;
    }
    .guide-toolbar {
      display: flex; align-items: center; gap: 8px; padding: 10px 16px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .guide-toolbar button {
      background: none; border: 1px solid var(--border); color: var(--text-dim);
      padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .guide-toolbar button:hover { background: var(--surface-2); color: var(--text); }
    #guideDate { color: var(--text-dim); font-size: 13px; margin-left: auto; }
    .guide-grid { flex: 1; overflow: auto; }
    .guide-time-row, .guide-row { display: flex; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .guide-ch-label {
      width: 110px; min-width: 110px; padding: 8px 10px; font-size: 13px;
      background: var(--surface); position: sticky; left: 0; z-index: 2;
      display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden;
      border-right: 1px solid var(--border);
    }
    .guide-time-row .guide-ch-label { border-bottom: 1px solid var(--border); }
    .guide-programs { position: relative; height: 52px; flex-shrink: 0; }
    .guide-time-row .guide-programs { height: 30px; }
    .guide-time-mark {
      position: absolute; top: 0; font-size: 11px; color: var(--text-faint); padding: 6px 8px;
      border-left: 1px solid rgba(255,255,255,0.07); height: 100%;
    }
    .guide-program {
      position: absolute; top: 3px; height: calc(100% - 6px);
      background: var(--surface-2); border-radius: 6px; padding: 4px 8px;
      overflow: hidden; cursor: pointer; font-size: 12px;
      display: flex; flex-direction: row; align-items: center;
      border: 1px solid var(--border);
    }
    .guide-prog-text { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .guide-program:hover { background: var(--surface-3); border-color: rgba(255,255,255,0.2); z-index: 1; }
    .guide-program.on-now { background: rgba(233,69,96,0.12); border-color: rgba(233,69,96,0.5); }
    .guide-prog-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .guide-prog-ep { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .guide-now-line {
      position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 1;
      pointer-events: none; box-shadow: 0 0 6px rgba(233,69,96,0.6);
    }
    .guide-rec-btn {
      flex-shrink: 0; font-size: 14px; color: var(--text-faint); cursor: pointer;
      margin-left: 4px; line-height: 1; padding: 2px;
    }
    .guide-rec-btn:hover { color: var(--accent); }
    .guide-rec-btn.recording { color: var(--accent); }
    .guide-rec-btn.skipped { color: #e0a030; }

    /* ---------------- Rec menu ---------------- */
    .rec-menu {
      position: fixed; z-index: 200; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 5px; min-width: 190px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.55);
    }
    .rec-menu button {
      display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 7px;
      background: none; border: none; color: var(--text); font-size: 13.5px; cursor: pointer;
    }
    .rec-menu button:hover { background: var(--surface-3); }
    .rec-menu button.danger { color: var(--accent); }

    /* ---------------- Mobile / touch layout ---------------- */
    @media (max-width: 700px) {
      html, body { height: auto; }
      header {
        height: auto; padding: 10px max(14px, env(safe-area-inset-right)) 10px max(14px, env(safe-area-inset-left));
        gap: 12px; flex-wrap: wrap;
        padding-top: max(10px, env(safe-area-inset-top));
        /* Keep the tab bar on screen while the list scrolls */
        position: sticky; top: 0; z-index: 40;
      }
      .brand h1 { font-size: 15px; }
      header nav { margin-left: auto; }
      header nav button { padding: 7px 12px; font-size: 12.5px; }

      /* Stack the video above the channel/recording list */
      .container { flex-direction: column; height: auto; }
      .player-area {
        flex: none; width: 100%; order: -1;   /* video on top, list below */
        position: sticky; z-index: 30;
        /* Pin directly below the sticky header (JS keeps the var in sync) */
        top: var(--header-h-mobile, 48px);
      }
      video { flex: none; width: 100%; height: auto; aspect-ratio: 16 / 9; }

      .sidebar {
        width: 100%; min-width: 0; flex: none;
        overflow-y: visible; border-right: none;
      }
      .sidebar-search { position: static; }

      /* Larger touch targets in the lists */
      .channel-item, .recording-item { padding: 14px; }
      .rec-actions { top: 10px; }
      .rec-delete-btn, .rec-stop-btn { padding: 9px 11px; font-size: 14px; }

      /* Overlay controls: tighter paddings, larger tap targets */
      .player-top { padding: 10px 14px 30px; }
      .np-title { font-size: 14px; }
      .player-bottom { padding: 26px 12px 8px; }
      .ctl { width: 44px; height: 44px; }
      .btn-row { gap: 0; }
      .live-btn { margin-left: 4px; padding: 8px 12px; }
      .time-label { min-width: 34px; font-size: 12px; }
      .seek-row { gap: 8px; }

      /* Guide stays horizontally scrollable, just tighter */
      .guide-container { height: calc(100dvh - 58px); }
      .guide-ch-label { width: 78px; min-width: 78px; font-size: 12px; padding: 6px; }
    }

    /* Phone held in landscape while a stream is playing -> immersive fullscreen
       video. CSS-driven (no Fullscreen API) so it works on iOS, which blocks
       programmatic fullscreen without a user gesture. max-height targets phones
       (short in landscape) without catching tablets/laptops. */
    @media (orientation: landscape) and (max-height: 500px) {
      body.has-stream header,
      body.has-stream .sidebar { display: none; }
      body.has-stream .container { height: 100dvh; }
      body.has-stream .player-area {
        position: fixed; inset: 0; order: 0;
        width: 100vw; height: 100dvh; z-index: 50;
      }
      body.has-stream video {
        width: 100%; height: 100%; aspect-ratio: auto; object-fit: contain;
      }
      body.has-stream .player-bottom {
        padding-left: max(20px, env(safe-area-inset-left));
        padding-right: max(20px, env(safe-area-inset-right));
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }
      body.has-stream .player-top {
        padding-left: max(20px, env(safe-area-inset-left));
        padding-right: max(20px, env(safe-area-inset-right));
      }
    }
  </style>
</head>
<body>

            </button>
            <button class="ctl" onclick="seekTo(30)" title="Forward 30 seconds">
              <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6h2c0 4.4-3.6 8-8 8s-8-3.6-8-8 3.6-8 8-8z"/><text x="12" y="16.5" text-anchor="middle" font-size="7.5" font-weight="bold" fill="currentColor" stroke="none" font-family="inherit">30</text></svg>
            </button>
            <button class="live-btn hidden" id="liveBtn" onclick="goLive()" title="Jump to live">
              <span class="live-dot"></span>LIVE

            <button class="ctl rec-btn hidden" id="recBtn" onclick="toggleRecord(event)" title="Record">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>

              <button class="ctl" onclick="toggleMute()" id="muteBtn" title="Mute (m)">
                <svg class="icon-main" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <svg class="icon-alt" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
              </button>
            </span>
            <button class="ctl hidden-btn" onclick="showAirplayPicker()" id="airplayBtn" title="AirPlay">
              <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h4v-2H3V5h18v10h-4v2h4c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/><path d="M12 15l6 7H6l6-7z"/></svg>
            </button>
            <button class="ctl hidden-btn" onclick="togglePip()" id="pipBtn" title="Picture in Picture — keeps playing when you switch apps">
              <svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16.01H3V4.98h18v14.03z"/></svg>
            </button>
            <button class="ctl" onclick="toggleTheater()" id="theaterBtn" title="Theater mode (t)">
              <svg viewBox="0 0 24 24"><path d="M19 6H5c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H5V8h14v8z"/></svg>
            </button>
            <button class="ctl" onclick="toggleFullscreen()" id="fullscreenBtn" title="Fullscreen (f)">
              <svg class="icon-main" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
              <svg class="icon-alt" viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>

  <div class="guide-container" id="guide-container" style="display:none">

      <button onclick="guideNav(3)">3h &raquo;</button>

  <div class="modal-overlay" id="channelModal" onclick="if(event.target===this)closeChannelPicker()">
    <div class="modal">
      <h2>Select Channels</h2>
      <input type="text" class="modal-search" id="modalSearch" placeholder="Filter..." oninput="filterModal()">
      <div class="modal-list" id="modalList"></div>
      <div class="modal-actions">
        <button onclick="selectAllVisible()">All</button>
        <button onclick="selectNoneVisible()">None</button>
        <button class="primary" onclick="saveChannelPicker()">Save</button>
      </div>
    </div>
  </div>

  <script>
    let channels = [];
    let recordings = [];
    let library = [];      // local archived copies (from /api/library)
    let archiveJobs = [];  // in-flight archive queue state
    let isLocal = false;   // current playback is a local MP4 (native seek, no session)
    let recView = localStorage.getItem('recView') || 'date';  // date | shows | az
    const expandedShows = new Set();  // open groups in the Shows view (session only)
    let guideData = {};
    let currentTab = 'live';
    let hls = null;
    let currentSessionId = null;
    let totalDuration = 0;     // full recording duration from metadata (seconds)
    let serverOffset = 0;      // where FFmpeg started transcoding from (seconds)
    let isLive = false;
    let liveRecording = null; // non-null when watching a live channel that's being recorded
    let favorites = []; // empty = show all
    let currentRecordingId = null;
    let currentChannelId = null;  // numeric channel id we're playing live
    let seriesIndex = {}; // cloudShowId -> { path, title, schedule }
    let currentShowId = null; // cloud show ID of what's playing live
    let tunerStatus = []; // active tuner info from device
    let scheduledAirings = []; // per-airing schedule state from the device (what will actually record)

    async function loadScheduledAirings() {
      try {
        const r = await (await fetch('/api/scheduled-airings')).json();
        if (Array.isArray(r)) scheduledAirings = r;
      } catch {}
    }

    // Is this specific airing on the device's "will record" list? A series
    // rule isn't enough: Tablo skips an airing as a duplicate when the same
    // episode is scheduled at another time/channel, and skips conflicts.
    function isAiringScheduled(datetime, channelIdentifier) {
      if (!datetime) return false;
      const t = new Date(datetime).getTime();
      return scheduledAirings.some(a =>
        new Date(a.datetime).getTime() === t &&
        (!channelIdentifier || !a.channelIdentifier || a.channelIdentifier === channelIdentifier));
    }
    let recPending = false; // record requested for the current airing; tuner hasn't confirmed capture yet

    const isTouch = window.matchMedia('(hover: none)').matches;

    // Mobile: header and video are both sticky; the video pins just below
    // the header, whose height varies (safe-area inset, nav wrapping).
    function syncHeaderOffset() {
      const h = document.querySelector('header').offsetHeight;
      document.documentElement.style.setProperty('--header-h-mobile', h + 'px');
    }
    window.addEventListener('resize', syncHeaderOffset);
    syncHeaderOffset();

    // Resume position tracking — save to localStorage every 5 seconds
    function saveResumePosition() {
      if (!currentRecordingId) return;
      const v = document.getElementById('video');
      const pos = serverOffset + (v.currentTime || 0);
      if (pos > 5) localStorage.setItem('resume_' + currentRecordingId, String(Math.floor(pos)));
    }
    function getResumePosition(recordingId) {
      return parseInt(localStorage.getItem('resume_' + recordingId) || '0', 10);
    }
    function saveWatchState() {
      const state = { tab: currentTab };
      if (currentRecordingId) {
        state.recordingId = currentRecordingId;
      } else {
        const activeCh = document.querySelector('.channel-item.active');
        if (activeCh) state.channelId = activeCh.dataset.id;
      }
      localStorage.setItem('watchState', JSON.stringify(state));
    }
    setInterval(() => { saveResumePosition(); saveWatchState(); }, 5000);
    window.addEventListener('beforeunload', () => { saveResumePosition(); saveWatchState(); });

    // Free the transcode session when the page actually goes away (navigation,
    // tab close) — otherwise it burns an encode slot until the 5-min reaper.
    // Deliberately NOT on visibilitychange: backgrounding (or PiP) must keep
    // the session; sendBeacon survives unload where fetch may not.
    window.addEventListener('pagehide', () => {
      if (currentSessionId) navigator.sendBeacon('/api/stop/' + currentSessionId);
    });

    // Keep the server-side transcode session alive while a stream is loaded
    // (paused or playing). Without this, a paused player stops requesting
    // segments, the server's 5-min inactivity timer fires, ffmpeg is killed
    // and the segment dir is rm -rf'd — so resume plays only the in-memory
    // MSE buffer (~30-90s) before 404'ing.
    // Doubles as a dead-session detector: a 404 means the session was reaped
    // (server restart, suspended tab outliving the inactivity window) — the
    // hls.js path notices via its own network errors, but iOS native HLS has
    // no error callback for this, so recover from here.
    setInterval(async () => {
      if (!currentSessionId) return;
      try {
        const res = await fetch(`/hls/${currentSessionId}/stream.m3u8`, { method: 'HEAD' });
        if (res.status === 404 && document.body.classList.contains('has-stream')) recoverExpiredSession();
      } catch {}
    }, 60000);

    // iPhone: Safari suspends the page when backgrounded, so the keepalive
    // stops and the server reaps the session. On return, check immediately
    // and reopen at the saved position instead of leaving a dead player.
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState !== 'visible' || !currentSessionId) return;
      if (!document.body.classList.contains('has-stream')) return;
      try {
        const res = await fetch(`/hls/${currentSessionId}/stream.m3u8`, { method: 'HEAD' });
        if (res.status === 404) recoverExpiredSession();
      } catch {
        recoverExpiredSession();
      }
    });

    async function init() {
      try {
        const [chRes, recRes, guideRes, favRes, seriesRes, tunerRes, libRes] = await Promise.all([
          fetch('/api/channels'),
          fetch('/api/recordings'),
          fetch('/api/guide'),
          fetch('/api/favorites'),
          fetch('/api/series'),
          fetch('/api/tuners'),
          fetch('/api/library'),
        ]);
        channels = await chRes.json();
        recordings = await recRes.json();
        guideData = await guideRes.json();
        favorites = await favRes.json();
        seriesIndex = await seriesRes.json();
        const tuners = await tunerRes.json().catch(() => []);
        tunerStatus = Array.isArray(tuners) ? tuners : [];
        loadScheduledAirings().then(() => { if (currentTab === 'guide') renderGuide(); updateRecBtn(); });
        const lib = await libRes.json().catch(() => ({}));
        library = lib.entries || [];
        archiveJobs = lib.jobs || [];
      } catch (e) {
        showError('Failed to load data: ' + e.message);
      }
      renderChannels();
      renderRecordings();

      // Restore last watch state on refresh
      try {
        const saved = JSON.parse(localStorage.getItem('watchState') || '{}');
        if (saved.tab) showTab(saved.tab);
        if (saved.recordingId) {
          const el = document.querySelector(`.recording-item[data-id="${saved.recordingId}"]`);
          playItem(saved.recordingId, el);
        } else if (saved.channelId) {
          const el = document.querySelector(`.channel-item[data-id="${saved.channelId}"]`);
          if (el) playChannel(saved.channelId, el);
        }
      } catch (e) {
        console.warn('Failed to restore watch state:', e);
      }
    }

    function esc(str) {
      const el = document.createElement('span');
      el.textContent = str;
      return el.innerHTML;
    }

    function renderChannels() {
      const list = document.getElementById('channel-list');
      const visible = favorites.length > 0 ? channels.filter(ch => favorites.includes(ch.id)) : channels;
      list.innerHTML = visible.map(ch => {
        const now = getCurrentAiring(ch.id);
        const rec = isChannelRecording(ch.id);
        const search = `${ch.number} ${ch.name} ${ch.callSign}`.toLowerCase();
        const active = String(ch.id) === String(currentChannelId) ? ' active' : '';
        return `<div class="channel-item${active}" data-id="${ch.id}" data-search="${esc(search)}" onclick="playChannel('${esc(ch.id)}', this)">
          <div><span class="channel-number">${esc(ch.number)}</span><span class="channel-name">${esc(ch.name)}</span>${rec ? '<span class="ch-rec-dot">REC</span>' : ''}</div>
          ${now ? `<div class="channel-now">${esc(now)}</div>` : ''}
        </div>`;
      }).join('');
    }

    // ---------- Merged recordings model ----------
    // One list combining what's on the Tablo and what's archived locally.
    // Items are keyed by the Tablo recording id (the local copy keeps the id
    // after the Tablo copy is deleted, so resume positions carry over).
    function mergedRecordings() {
      const libById = new Map(library.map(l => [String(l.id), l]));
      const items = recordings.map(r => ({ id: String(r.id), rec: r, lib: libById.get(String(r.id)) || null }));
      const seen = new Set(items.map(i => i.id));
      for (const l of library) {
        if (!seen.has(String(l.id))) items.push({ id: String(l.id), rec: null, lib: l });
      }
      return items;
    }

    function jobFor(id) {
      return archiveJobs.find(j => String(j.id) === String(id)) || null;
    }
    function jobActive(job) {
      return !!job && (job.status === 'queued' || job.status === 'transcoding' || job.status === 'verifying');
    }

    // Sort key that ignores leading articles so "The Rookie" files under R
    function titleKey(t) {
      return String(t || '').replace(/^(the|a|an)\s+/i, '').toLowerCase();
    }
    function byDateDesc(a, b) {
      return new Date((b.rec || b.lib).date || 0) - new Date((a.rec || a.lib).date || 0);
    }

    function renderRecItem(it) {
      const rec = it.rec, lib = it.lib;
      const src = rec || lib;
      const now = Date.now();
      const inProgress = rec ? isInProgress(rec, now) : false;
      const effDur = rec ? effectiveDuration(rec) : (lib.duration || 0);
      // Date AND time: repeated captures of the same episode (record, stop,
      // record again) are otherwise indistinguishable in the list.
      const d = src.date ? new Date(src.date) : null;
      const date = d ? d.toLocaleDateString([], { month: 'numeric', day: 'numeric' }) + ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
      const dur = effDur ? Math.round(effDur / 60) + ' min' : '';
      const isPartial = rec && rec.state && rec.state !== 'recording' && rec.recordedDuration && rec.duration && rec.recordedDuration < rec.duration * 0.85;
      const resume = getResumePosition(it.id);
      const hasResume = resume > 10 && effDur && resume < effDur - 30;
      const size = lib && lib.size ? (lib.size >= 1e9 ? (lib.size / 1e9).toFixed(1) + ' GB' : Math.round(lib.size / 1e6) + ' MB') : '';
      const meta = [src.channel, date, dur, isPartial ? 'partial' : '', rec && rec.state === 'failed' ? 'failed' : '', size]
        .filter(Boolean).join(' · ');
      const epInfo = src.seasonNumber && src.episodeNumber
        ? `S${src.seasonNumber}E${src.episodeNumber}${src.episode ? ': ' + src.episode : ''}`
        : (src.episode || '');
      const search = `${src.title} ${src.episode || ''}`.toLowerCase();

      const job = jobFor(it.id);
      let badges = '';
      if (inProgress) badges += '<span class="rec-live-badge" title="Recording now">REC</span>';
      if (lib) badges += '<span class="rec-saved-badge" title="Saved on this machine">SAVED</span>';
      else if (jobActive(job)) {
        const label = job.status === 'queued' ? 'QUEUED'
          : job.status === 'verifying' ? 'VERIFYING'
          : 'SAVING ' + Math.round((job.progress || 0) * 100) + '%';
        badges += `<span class="rec-arch-badge">${label}</span>`;
      } else if (job && job.status === 'failed') {
        badges += `<span class="rec-arch-badge failed" title="${escAttr(job.error || '')}">SAVE FAILED</span>`;
      }

      // For in-progress recordings, show a Stop button (■) next to the X
      // delete. Stop ends the capture but keeps the partial file; X
      // deletes everything (including any partial).
      const stopBtn = inProgress
        ? `<span class="rec-stop-btn" onclick="stopRec('${it.id}', event)" title="Stop recording (keep partial)">&#9632;</span>`
        : '';
      const archBtn = rec && !inProgress && !lib && !jobActive(job)
        ? `<span class="rec-archive-btn" onclick="archiveRec('${it.id}', event)" title="Save a copy on this machine">&#10515;</span>`
        : '';
      const activeCls = String(currentRecordingId) === it.id ? ' active' : '';

      return `<div class="recording-item${activeCls}" data-id="${it.id}" data-search="${esc(search)}" data-duration="${effDur}" onclick="playItem('${it.id}', this)">
        <div class="rec-actions">${stopBtn}${archBtn}<span class="rec-delete-btn" onclick="recDelete('${it.id}', event)" title="Delete recording">&#10005;</span></div>
        <div class="recording-title">${badges}${esc(src.title)}</div>
        ${epInfo ? `<div class="recording-episode">${esc(epInfo)}</div>` : ''}
        ${meta ? `<div class="recording-meta">${esc(meta)}</div>` : ''}
        ${hasResume ? `<div class="resume-bar" title="Resume at ${fmt(resume)}"><i style="width:${Math.min(100, (resume / effDur) * 100)}%"></i></div>` : ''}
      </div>`;
    }

    function setRecView(view) {
      recView = view;
      localStorage.setItem('recView', view);
      renderRecordings();
    }

    function toggleShowGroup(headerEl) {
      const group = headerEl.closest('.rec-group');
      const key = group.dataset.key;
      if (group.classList.toggle('open')) expandedShows.add(key);
      else expandedShows.delete(key);
    }

    function renderRecordings() {
      const list = document.getElementById('recording-list');
      const now = Date.now();
      for (const v of ['date', 'shows', 'az']) {
        const btn = document.getElementById('rv-' + v);
        if (btn) btn.classList.toggle('active', recView === v);
      }

      const items = mergedRecordings();
      let html = '';

      if (recView === 'shows') {
        // Rolled up by show, alphabetical; expand a show to see its episodes
        const groups = new Map();
        for (const it of items) {
          const key = titleKey((it.rec || it.lib).title);
          if (!groups.has(key)) groups.set(key, { title: (it.rec || it.lib).title || 'Unknown', items: [] });
          groups.get(key).items.push(it);
        }
        const sorted = [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]));
        for (const [key, g] of sorted) {
          g.items.sort(byDateDesc);
          const savedCount = g.items.filter(i => i.lib).length;
          const n = g.items.length;
          const anyLive = g.items.some(i => i.rec && isInProgress(i.rec, now));
          const open = expandedShows.has(key);
          html += `<div class="rec-group${open ? ' open' : ''}" data-key="${escAttr(key)}">
            <div class="rec-group-header" onclick="toggleShowGroup(this)">
              <span class="chev">&#9654;</span>
              <span class="g-title">${anyLive ? '<span class="rec-live-badge" title="Recording now">REC</span>' : ''}${esc(g.title)}</span>
              <span class="count">${n} ep${n === 1 ? '' : 's'}${savedCount ? ` · ${savedCount} saved` : ''}</span>
            </div>
            <div class="rec-group-items">${g.items.map(renderRecItem).join('')}</div>
          </div>`;
        }
      } else if (recView === 'az') {
        // Flat alphabetical with letter headers
        const sorted = items.slice().sort((a, b) =>
          titleKey((a.rec || a.lib).title).localeCompare(titleKey((b.rec || b.lib).title)) || byDateDesc(a, b));
        let lastLetter = null;
        for (const it of sorted) {
          const first = (titleKey((it.rec || it.lib).title)[0] || '#').toUpperCase();
          const letter = /[A-Z]/.test(first) ? first : '#';
          if (letter !== lastLetter) {
            html += `<div class="rec-letter">${letter}</div>`;
            lastLetter = letter;
          }
          html += renderRecItem(it);
        }
      } else {
        // Date view: in-progress first, then newest first
        const sorted = items.slice().sort((a, b) => {
          const aLive = a.rec && isInProgress(a.rec, now) ? 1 : 0;
          const bLive = b.rec && isInProgress(b.rec, now) ? 1 : 0;
          if (aLive !== bLive) return bLive - aLive;
          return byDateDesc(a, b);
        });
        html = sorted.map(renderRecItem).join('');
      }

      list.innerHTML = html;
      if (document.getElementById('search').value) filterList();
    }

    function isInProgress(rec, now) {
      // The device's capture state is authoritative: a stopped partial is
      // 'finished' even though the wall clock says the airing is still on.
      if (rec.state) return rec.state === 'recording';
      if (!rec.date || !rec.duration) return false;
      const start = new Date(rec.date).getTime();
      return now >= start && now < start + rec.duration * 1000;
    }

    // Actual watchable length: the device-reported recorded duration for
    // completed captures (partials are shorter than scheduled), scheduled
    // duration otherwise.
    function effectiveDuration(rec) {
      const finished = rec.state && rec.state !== 'recording';
      return (finished && rec.recordedDuration) ? rec.recordedDuration : (rec.duration || 0);
    }

    function getCurrentAiring(channelId) {
      const airings = guideData[channelId];
      if (!airings || !airings.length) return null;
      const now = Date.now();
      const current = airings.find(a => {
        const start = new Date(a.datetime || a.start).getTime();
        const end = start + ((a.duration || 1800) * 1000);
        return now >= start && now <= end;
      });
      if (!current) return null;
      // Prefer series title (matches the guide grid); append episode title when distinct.
      const series = current.show?.title || current.series_title || '';
      const episode = current.title || '';
      if (series && episode && series !== episode) return `${series} · ${episode}`;
      return series || episode || null;
    }

    function showTab(tab) {
      currentTab = tab;
      document.getElementById('btn-live').classList.toggle('active', tab === 'live');
      document.getElementById('btn-recordings').classList.toggle('active', tab === 'recordings');
      document.getElementById('btn-guide').classList.toggle('active', tab === 'guide');

      const mainContainer = document.querySelector('.container');
      const guideContainer = document.getElementById('guide-container');

      if (tab === 'guide') {
        mainContainer.style.display = 'none';
        guideContainer.style.display = 'flex';
        renderGuide();
      } else {
        mainContainer.style.display = 'flex';
        guideContainer.style.display = 'none';
        document.getElementById('channel-list').style.display = tab === 'live' ? 'block' : 'none';
        document.getElementById('recording-list').style.display = tab === 'recordings' ? 'block' : 'none';
        document.getElementById('rec-view-bar').style.display = tab === 'recordings' ? 'flex' : 'none';
        document.getElementById('search').value = '';
        filterList();
        if (tab === 'recordings') refreshRecordings();
      }
    }

    async function refreshLibrary() {
      try {
        const data = await (await fetch('/api/library')).json();
        library = data.entries || [];
        archiveJobs = data.jobs || [];
      } catch (e) {}
    }

    async function refreshRecordings() {
      try {
        await fetch('/api/refresh', { method: 'POST' });
        const res = await fetch('/api/recordings');
        recordings = await res.json();
        await refreshLibrary();
        renderRecordings();
      } catch (e) {
        console.warn('Failed to refresh recordings:', e);
      }
    }

    // While an archive is running (or the tab is open), keep the SAVING %
    // badge and SAVED flips current without a manual refresh.
    setInterval(async () => {
      const active = archiveJobs.some(jobActive);
      if (!active && currentTab !== 'recordings') return;
      const before = JSON.stringify([library.length, archiveJobs]);
      await refreshLibrary();
      if (currentTab === 'recordings' && JSON.stringify([library.length, archiveJobs]) !== before) {
        renderRecordings();
      }
    }, 5000);

    function filterList() {
      const q = document.getElementById('search').value.toLowerCase();
      if (currentTab === 'live') {
        for (const item of document.getElementById('channel-list').children) {
          const text = item.getAttribute('data-search') || '';
          item.style.display = text.includes(q) ? '' : 'none';
        }
        return;
      }
      const list = document.getElementById('recording-list');
      for (const item of list.querySelectorAll('.recording-item')) {
        const text = item.getAttribute('data-search') || '';
        item.style.display = text.includes(q) ? '' : 'none';
      }
      // A-Z letter headers don't correspond to the filtered set — hide while searching
      for (const h of list.querySelectorAll('.rec-letter')) {
        h.style.display = q ? 'none' : '';
      }
      // Shows view: hide groups with no matches; force matching groups open
      // during a search so hits inside collapsed shows are visible.
      for (const g of list.querySelectorAll('.rec-group')) {
        const any = [...g.querySelectorAll('.recording-item')].some(i => i.style.display !== 'none');
        g.style.display = any ? '' : 'none';
        g.querySelector('.rec-group-items').classList.toggle('force-open', !!q);
      }
    }

    // Pull fresh recordings + tuner state and re-render whatever tab is
    // visible. Used after delete / stop / record so REC badges and the
    // channel list reflect reality without waiting for the 15s poll.
    async function refreshAll() {
      try {
        await fetch('/api/refresh', { method: 'POST' });
        const [recsRes, tunRes] = await Promise.all([
          fetch('/api/recordings'),
          fetch('/api/tuners'),
          refreshLibrary(),
          loadScheduledAirings(),
        ]);
        const newRecs = await recsRes.json();
        recordings.length = 0;
        recordings.push(...newRecs);
        tunerStatus = await tunRes.json();
        updateRecBtn();
        if (currentTab === 'live') renderChannels();
        if (currentTab === 'guide') renderGuide();
        if (currentTab === 'recordings') renderRecordings();
      } catch (e) {}
    }

    // Locally clear any tuner entries that point at the just-deleted/stopped
    // recording. /server/tuners on the device takes a few seconds to flush
    // after a DELETE, so without this the live-tv tab would still show a
    // REC badge until the next refresh catches up.
    function dropTunerForRecording(recPath) {
      if (!recPath) return;
      tunerStatus = tunerStatus.map(t =>
        t.recording === recPath ? { ...t, in_use: false, recording: null, channel: null, channel_identifier: null } : t
      );
    }

    async function deleteRec(recordingId, event) {
      if (event) event.stopPropagation();
      const rec = recordings.find(r => String(r.id) === String(recordingId));
      const name = rec ? `${rec.title}${rec.episode ? ' - ' + rec.episode : ''}` : 'this recording';
      const hasLocal = library.some(l => String(l.id) === String(recordingId));
      // "Watching it" only matters if playback is coming FROM the Tablo — a
      // local copy keeps playing (and survives) after the Tablo copy is gone.
      const watchingIt = !isLocal && String(currentRecordingId) === String(recordingId);
      const scope = hasLocal ? ' from the Tablo? (Your saved copy stays.)' : '?';
      const msg = watchingIt
        ? `Delete ${name}${scope} You're watching it — playback will stop.`
        : `Delete ${name}${scope}`;
      if (!confirm(msg)) return;
      try {
        await fetch('/api/recording/' + recordingId, { method: 'DELETE' });
        if (!hasLocal) localStorage.removeItem('resume_' + recordingId);
        if (watchingIt) stopPlayback();
        // Optimistic local update — drop the recording from our list and
        // free its tuner slot. Tablo's tuner state lags the DELETE by a
        // few seconds, so reading /api/tuners right now would still show
        // it recording. Re-render immediately, then do a follow-up
        // authoritative refresh once the device has caught up.
        recordings = recordings.filter(r => String(r.id) !== String(recordingId));
        dropTunerForRecording(rec?.path);
        if (currentTab === 'live') renderChannels();
        if (currentTab === 'guide') renderGuide();
        if (currentTab === 'recordings') renderRecordings();
        setTimeout(refreshAll, 3000);
      } catch (e) {
        console.error('Delete failed:', e);
      }
    }

    async function stopRec(recordingId, event) {
      if (event) event.stopPropagation();
      const rec = recordings.find(r => String(r.id) === String(recordingId));
      const name = rec ? `${rec.title}${rec.episode ? ' - ' + rec.episode : ''}` : 'this recording';
      if (!confirm(`Stop recording ${name}? (Keeps what's been recorded so far.)`)) return;
      try {
        const res = await fetch('/api/recording/' + recordingId + '/stop', { method: 'POST' });
        const data = await res.json();
        if (data.error) { showError(data.error); return; }
        // Stop keeps the recording in the list (with the partial), but the
        // tuner is freed. Drop the tuner binding optimistically.
        dropTunerForRecording(rec?.path);
        if (rec) rec.state = 'finished';
        // If we're watching this capture, transition the player right away
        // instead of waiting for the status poll to notice.
        if (liveRecording && String(liveRecording.id) === String(recordingId)) {
          endLiveWatch(null);
        }
        if (currentTab === 'live') renderChannels();
        if (currentTab === 'guide') renderGuide();
        if (currentTab === 'recordings') renderRecordings();
        setTimeout(refreshAll, 3000);
      } catch (e) {
        console.error('Stop failed:', e);
      }
    }

    // ---------- Local archive actions ----------
    async function archiveRec(recordingId, event) {
      if (event) event.stopPropagation();
      try {
        const res = await fetch('/api/archive/' + recordingId, { method: 'POST' });
        const data = await res.json();
        if (data.error) { showError(data.error); return; }
        archiveJobs = archiveJobs.filter(j => String(j.id) !== String(recordingId)).concat([data.job]);
        showToast('Saving to this machine…');
        if (currentTab === 'recordings') renderRecordings();
      } catch (e) {
        showError('Archive failed: ' + e.message);
      }
    }

    async function deleteLocal(recordingId, event) {
      if (event) event.stopPropagation();
      const lib = library.find(l => String(l.id) === String(recordingId));
      if (!lib) return;
      const name = `${lib.title}${lib.episode ? ' - ' + lib.episode : ''}`;
      const onTablo = recordings.some(r => String(r.id) === String(recordingId));
      const watchingIt = isLocal && String(currentRecordingId) === String(recordingId);
      let msg = `Delete the saved copy of ${name}?${onTablo ? ' (The Tablo copy stays.)' : ' This is the ONLY copy.'}`;
      if (watchingIt) msg += ' You\'re watching it — playback will stop.';
      if (!confirm(msg)) return;
      try {
        const res = await fetch('/api/library/' + recordingId, { method: 'DELETE' });
        const data = await res.json();
        if (data.error) { showError(data.error); return; }
        library = library.filter(l => String(l.id) !== String(recordingId));
        archiveJobs = archiveJobs.filter(j => String(j.id) !== String(recordingId));
        if (!onTablo) localStorage.removeItem('resume_' + recordingId);
        if (watchingIt) stopPlayback();
        if (currentTab === 'recordings') renderRecordings();
      } catch (e) {
        showError('Delete failed: ' + e.message);
      }
    }

    async function deleteBoth(recordingId) {
      const it = mergedRecordings().find(i => i.id === String(recordingId));
      const src = it && (it.rec || it.lib);
      const name = src ? `${src.title}${src.episode ? ' - ' + src.episode : ''}` : 'this recording';
      const watchingIt = String(currentRecordingId) === String(recordingId);
      if (!confirm(`Delete ${name} from the Tablo AND this machine?${watchingIt ? ' You\'re watching it — playback will stop.' : ''}`)) return;
      try {
        await fetch('/api/library/' + recordingId, { method: 'DELETE' });
        library = library.filter(l => String(l.id) !== String(recordingId));
        archiveJobs = archiveJobs.filter(j => String(j.id) !== String(recordingId));
      } catch (e) {}
      try {
        await fetch('/api/recording/' + recordingId, { method: 'DELETE' });
        recordings = recordings.filter(r => String(r.id) !== String(recordingId));
        dropTunerForRecording(it?.rec?.path);
      } catch (e) {}
      localStorage.removeItem('resume_' + recordingId);
      if (watchingIt) stopPlayback();
      if (currentTab === 'recordings') renderRecordings();
      setTimeout(refreshAll, 3000);
    }

    // The X button: with only one copy it's a straight delete; with both a
    // Tablo and a saved copy, ask which one.
    function recDelete(recordingId, event) {
      if (event) event.stopPropagation();
      const it = mergedRecordings().find(i => i.id === String(recordingId));
      if (!it) return;
      if (it.rec && it.lib) {
        closeRecMenu();
        const menu = document.createElement('div');
        menu.className = 'rec-menu';
        menu.id = 'recMenu';
        menu.innerHTML = `
          <button onclick="closeRecMenu(); deleteRec('${it.id}')">Delete from Tablo (keep saved copy)</button>
          <button class="danger" onclick="closeRecMenu(); deleteLocal('${it.id}')">Delete saved copy (keep on Tablo)</button>
          <button class="danger" onclick="closeRecMenu(); deleteBoth('${it.id}')">Delete both</button>`;
        menu.style.left = Math.min(event.clientX, window.innerWidth - 260) + 'px';
        menu.style.top = Math.min(event.clientY, window.innerHeight - 160) + 'px';
        document.body.appendChild(menu);
        setTimeout(() => document.addEventListener('click', closeRecMenu), 0);
      } else if (it.lib) {
        deleteLocal(recordingId, event);
      } else {
        deleteRec(recordingId, event);
      }
    }

    // Play a merged item: prefer the local MP4 (instant native seek, no
    // transcode) unless the capture is still in progress — live viewing needs
    // the Tablo's growing stream.
    function playItem(recordingId, el) {
      const it = mergedRecordings().find(i => i.id === String(recordingId));
      if (!it) return;
      const inProg = it.rec && isInProgress(it.rec, Date.now());
      if (it.lib && !inProg) return playLocalRecording(recordingId, el);
      if (it.rec) return playRecording(recordingId, effectiveDuration(it.rec), el || document.createElement('div'));
    }

    async function playLocalRecording(recordingId, el) {
      const lib = library.find(l => String(l.id) === String(recordingId));
      if (!lib) return;
      clearActive();
      if (el) el.classList.add('active');
      stopLiveStatusPoll();
      currentRecordingId = String(recordingId);
      currentChannelId = null;
      isLive = false;
      liveRecording = null;
      currentShowId = null;
      isLocal = true;
      totalDuration = lib.duration || 0;
      serverOffset = 0;
      const epInfo = lib.seasonNumber && lib.episodeNumber
        ? `S${lib.seasonNumber}E${lib.episodeNumber}: ${lib.episode}`
        : lib.episode;
      setNowPlaying(lib.title, [epInfo, lib.channel].filter(Boolean).join(' · '));
      updateRecBtn();

      document.getElementById('status').classList.add('hidden');
      setLoading('Loading saved recording...');
      clearError();
      releaseSession();
      const gen = ++playGen;
      const video = freshVideo();
      const resume = getResumePosition(recordingId);
      video.src = `/library/video/${recordingId}`;
      video.addEventListener('loadedmetadata', () => {
        if (gen !== playGen) return;
        if (!totalDuration && isFinite(video.duration)) totalDuration = video.duration;
        if (resume > 10 && resume < totalDuration - 30) video.currentTime = resume;
        onStreamReady();
        document.getElementById('liveBtn').classList.add('hidden');
        video.play().catch(() => {});
      }, { once: true });
      video.addEventListener('error', () => {
        if (gen !== playGen) return;
        hideLoading();
        showError('Failed to play saved recording');
      });
    }

    function isChannelRecording(channelId) {
      return Array.isArray(tunerStatus) && tunerStatus.some(t => t.in_use && t.recording && t.channel === '/guide/channels/' + channelId);
    }

    async function refreshTuners() {
      try {
        const safe = Array.isArray(tunerStatus) ? tunerStatus : [];
        const before = JSON.stringify(safe.map(t => t.recording));
        const fresh = await (await fetch('/api/tuners')).json().catch(() => []);
        tunerStatus = Array.isArray(fresh) ? fresh : [];
        const after = JSON.stringify(tunerStatus.map(t => t.recording));
        // If the set of in-progress recordings changed, re-render so REC
        // badges appear/disappear without waiting for a manual refresh.
        if (before !== after) {
          updateRecBtn();
          if (currentTab === 'live') renderChannels();
          if (currentTab === 'guide') renderGuide();
          // Also pull a fresh recordings list so a newly-started recording
          // shows up in the recordings tab too.
          try {
            await fetch('/api/refresh', { method: 'POST' });
            const r = await fetch('/api/recordings');
            const newRecs = await r.json();
            recordings.length = 0;
            recordings.push(...newRecs);
            if (currentTab === 'recordings') renderRecordings();
          } catch {}
        }
      } catch (e) {}
    }
    setInterval(refreshTuners, 15000);

    function updateRecBtn() {
      const btn = document.getElementById('recBtn');
      if (!isLive || !currentShowId) {
        btn.classList.add('hidden');
        return;
      }
      btn.classList.remove('hidden');
      const entry = seriesIndex[currentShowId];
      const seriesScheduled = entry && entry.schedule !== 'none';
      // Red = THIS airing is actually capturing right now (tuner has a
      // recording on the active channel). Series-level schedule alone is
      // not enough — Tablo may be skipping this airing for conflicts or
      // dedup reasons. Reflected via tooltip instead.
      const isCapturing = currentChannelId != null && isChannelRecording(currentChannelId);
      if (isCapturing) recPending = false;
      btn.classList.toggle('recording', isCapturing);
      // Pending = we asked for a recording but the tuner hasn't started
      // capturing yet (Tablo takes ~10-40s). Distinct fast-pulse style so the
      // click visibly did something.
      btn.classList.toggle('pending', !isCapturing && recPending);
      let airingSkipped = false;
      if (seriesScheduled && !isCapturing && currentChannelId != null && scheduledAirings.length > 0) {
        const ch = channels.find(c => String(c.id) === String(currentChannelId));
        const airings = guideData[currentChannelId] || guideData[String(currentChannelId)] || [];
        const now = Date.now();
        const cur = airings.find(a => {
          const st = new Date(a.datetime).getTime();
          return now >= st && now <= st + (a.duration || 1800) * 1000;
        });
        airingSkipped = !!cur && !isAiringScheduled(cur.datetime, ch?.cloudId);
      }
      btn.title = isCapturing
        ? 'Recording now — click to manage'
        : recPending
          ? 'Recording scheduled — starting shortly'
          : airingSkipped
            ? 'Series scheduled, but Tablo is skipping this airing (duplicate or conflict) — click to record it'
            : seriesScheduled
              ? 'Series scheduled — click to manage'
              : 'Record this show';
    }

    // After scheduling a recording for the current airing, poll the tuners
    // quickly until capture actually starts so the button turns red without
    // the user wondering whether the click worked.
    async function fastPollTuners(times = 10, intervalMs = 4000) {
      for (let i = 0; i < times && recPending; i++) {
        await new Promise(r => setTimeout(r, intervalMs));
        try {
          const fresh = await (await fetch('/api/tuners')).json();
          if (Array.isArray(fresh)) tunerStatus = fresh;
        } catch {}
        updateRecBtn();
        if (currentChannelId != null && isChannelRecording(currentChannelId)) {
          showToast('Recording started');
          if (currentTab === 'live') renderChannels();
          refreshAll();   // pull the new recording into the list
          return;
        }
      }
      recPending = false;
      updateRecBtn();
    }

    function toggleRecord(event) {
      if (!currentShowId) return;
      let airingDatetime = null;
      let channelIdentifier = null;
      if (currentChannelId != null) {
        const ch = channels.find(c => String(c.id) === String(currentChannelId));
        if (ch) channelIdentifier = ch.cloudId || null;
        const airings = guideData[currentChannelId] || guideData[String(currentChannelId)] || [];
        const now = Date.now();
        const current = airings.find(a => {
          const start = new Date(a.datetime).getTime();
          return now >= start && now <= start + (a.duration || 1800) * 1000;
        });
        if (current) airingDatetime = current.datetime;
      }
      toggleRecordShow(currentShowId, event || { clientX: 200, clientY: 200, stopPropagation(){}, preventDefault(){} }, airingDatetime, channelIdentifier);
    }

    function closeRecMenu() {
      const old = document.getElementById('recMenu');
      if (old) old.remove();
      document.removeEventListener('click', closeRecMenu);
    }

    function toggleRecordShow(showId, event, airingDatetime, channelIdentifier) {
      if (event) { event.stopPropagation(); event.preventDefault(); }
      closeRecMenu();

      const entry = seriesIndex[showId];
      const isSeriesRec = entry && entry.schedule !== 'none';

      const menu = document.createElement('div');
      menu.className = 'rec-menu';
      menu.id = 'recMenu';

      let html = '';
      // If this airing is being captured right now on the channel we're
      // watching, the natural action is stopping THAT capture — offer it
      // first instead of making the user hunt for the partial in the list.
      let capturingRec = null;
      if (currentChannelId != null && isChannelRecording(currentChannelId)) {
        const ch = channels.find(c => String(c.id) === String(currentChannelId));
        capturingRec = liveRecording
          || (ch && recordings.find(r => isInProgress(r, Date.now()) && r.channel.startsWith(ch.number + ' ')))
          || null;
      }
      if (capturingRec) {
        html += `<button class="danger" onclick="closeRecMenu(); stopRec('${escAttr(String(capturingRec.id))}')">Stop recording (keep partial)</button>`;
      } else if (airingDatetime) {
        const chArg = channelIdentifier ? `'${escAttr(channelIdentifier)}'` : 'null';
        if (isAiringScheduled(airingDatetime, channelIdentifier)) {
          // Already on the device's schedule (one-off or via the series rule):
          // offer to drop just this airing.
          html += `<button class="danger" onclick="doRecordAction('unsingle', '${escAttr(showId)}', '${escAttr(airingDatetime)}', ${chArg})">Don't record this episode</button>`;
        } else {
          html += `<button onclick="doRecordAction('single', '${escAttr(showId)}', '${escAttr(airingDatetime)}', ${chArg})">Record this episode</button>`;
        }
      }
      if (isSeriesRec) {
        html += `<button class="danger" onclick="doRecordAction('cancel-series', '${escAttr(showId)}')">Cancel series recording</button>`;
      } else {
        html += `<button onclick="doRecordAction('series-new', '${escAttr(showId)}')">Record new episodes</button>`;
        html += `<button onclick="doRecordAction('series-all', '${escAttr(showId)}')">Record all episodes</button>`;
      }
      menu.innerHTML = html;

      // Position near the click
      menu.style.left = Math.min(event.clientX, window.innerWidth - 200) + 'px';
      menu.style.top = Math.min(event.clientY, window.innerHeight - 150) + 'px';
      document.body.appendChild(menu);
      setTimeout(() => document.addEventListener('click', closeRecMenu), 0);
    }

    async function doRecordAction(action, showId, datetime, channelIdentifier) {
      closeRecMenu();
      const entry = seriesIndex[showId];
      try {
        if (action === 'unsingle') {
          const res = await fetch('/api/record-airing', { method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ showId, datetime, channelIdentifier, schedule: false })
          });
          const data = await res.json();
          if (data.error) { showError(data.error); return; }
          showToast('Recording canceled');
        } else if (action === 'single') {
          const res = await fetch('/api/record-airing', { method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ showId, datetime, channelIdentifier })
          });
          const data = await res.json();
          if (data.error) { showError(data.error); return; }
          // Airing currently on and we're watching its channel: give
          // immediate feedback and chase the tuner until capture starts.
          const airingNow = datetime && Date.now() >= new Date(datetime).getTime();
          if (airingNow && currentChannelId != null && showId === currentShowId) {
            recPending = true;
            showToast('Recording scheduled — starting shortly');
            fastPollTuners();
          } else {
            showToast('Recording scheduled');
          }
        } else if (action === 'series-new' || action === 'series-all') {
          const rule = action === 'series-new' ? 'new' : 'all';
          const res = await fetch('/api/record/' + encodeURIComponent(showId), { method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rule })
          });
          const data = await res.json();
          if (data.error) { showError(data.error); return; }
          if (entry) entry.schedule = rule;
          showToast(rule === 'new' ? 'Recording new episodes' : 'Recording all episodes');
          if (currentChannelId != null && showId === currentShowId) {
            recPending = true;
            fastPollTuners();
          }
        } else if (action === 'cancel-series') {
          const res = await fetch('/api/record/' + encodeURIComponent(showId), { method: 'DELETE' });
          const data = await res.json();
          if (data.error) { showError(data.error); return; }
          if (entry) entry.schedule = 'none';
          showToast('Series recording canceled');
        }
        updateRecBtn();
        // Tablo takes a few seconds to register a new schedule on its tuner,
        // so refresh once immediately and again after a short delay so the
        // new entry / REC badge appears without the user needing to reload.
        await refreshAll();
        setTimeout(refreshAll, 5000);
      } catch (e) {
        console.error('Record action failed:', e);
      }
    }

    function setNowPlaying(title, sub) {
      document.getElementById('npTitle').textContent = title || '';
      document.getElementById('npSub').textContent = sub || '';
    }

    async function playChannel(channelId, el) {
      clearActive();
      if (el) el.classList.add('active');
      currentChannelId = channelId;
      isLive = true;
      isLocal = false;
      liveRecording = null;
      currentShowId = null;
      recPending = false;

      // Find what's on now and set currentShowId for the record button
      const ch = channels.find(c => c.id === channelId || String(c.id) === String(channelId));
      let airingTitle = '';
      if (ch) {
        const now = Date.now();
        liveRecording = recordings.find(r =>
          isInProgress(r, now) && r.channel.startsWith(ch.number + ' ')
        ) || null;

        // Find current airing's show ID for recording
        const airings = guideData[ch.id] || [];
        const currentAiring = airings.find(a => {
          const start = new Date(a.datetime || a.start).getTime();
          const end = start + ((a.duration || 1800) * 1000);
          return now >= start && now <= end;
        });
        if (currentAiring?.show?.identifier) {
          currentShowId = currentAiring.show.identifier;
        }
        airingTitle = currentAiring ? (currentAiring.show?.title || currentAiring.title || '') : '';
      }
      setNowPlaying(ch ? `${ch.number} · ${ch.name}` : 'Live TV', airingTitle);
      updateRecBtn();

      if (liveRecording) {
        // Play the recording stream seeked to the live edge
        totalDuration = liveRecording.duration;
        currentRecordingId = liveRecording.id;
        const recStart = new Date(liveRecording.date).getTime();
        const liveOffset = Math.max(0, (Date.now() - recStart) / 1000 - 5);
        await playRecordingAtOffset(liveRecording.id, liveOffset);
      } else {
        totalDuration = 0;
        serverOffset = 0;
        await playHls(`/stream/hls/channel/${channelId}`);
      }
      startLiveStatusPoll();
    }

    async function playRecordingAtOffset(recordingId, offset) {
      const video = document.getElementById('video');
      const loading = document.getElementById('loading');
      const status = document.getElementById('status');

      status.classList.add('hidden');
      setLoading('Loading stream...');
      clearError();

      if (hls) { hls.destroy(); hls = null; }
      releaseSession();
      const gen = ++playGen;

      try {
        const res = await fetch(`/stream/hls/recording/${recordingId}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        if (gen !== playGen) {
          fetch('/api/stop/' + data.sessionId, { method: 'POST' }).catch(() => {});
          return;
        }
        currentSessionId = data.sessionId;

        // Seek to the live offset
        setLoading('Seeking to live...');
        const seekRes = await fetch(`/api/seek/${currentSessionId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ offset }),
        });
        const seekData = await seekRes.json();
        if (gen !== playGen) return;
        serverOffset = seekData.startOffset;

        setLoading('Preparing stream...');
        await waitForPlaylist(seekData.url, gen);
        if (gen !== playGen) return;
        loadHls(seekData.url, video, loading);
      } catch (e) {
        if (gen !== playGen) return;
        hideLoading();
        showError('Failed to start stream: ' + e.message);
      }
    }

    async function playRecording(recordingId, duration, el) {
      clearActive();
      el.classList.add('active');
      totalDuration = duration;
      currentRecordingId = recordingId;
      currentShowId = null;
      isLocal = false;
      updateRecBtn();

      // Detect if this recording is currently in progress (device state)
      const rec = recordings.find(r => String(r.id) === String(recordingId));
      if (rec) {
        if (isInProgress(rec, Date.now())) {
          isLive = true;
          liveRecording = rec;
          totalDuration = rec.duration;   // scheduled length caps the live edge
        } else {
          isLive = false;
          liveRecording = null;
          totalDuration = effectiveDuration(rec) || duration;
        }
        const epInfo = rec.seasonNumber && rec.episodeNumber
          ? `S${rec.seasonNumber}E${rec.episodeNumber}: ${rec.episode}`
          : rec.episode;
        setNowPlaying(rec.title, [epInfo, rec.channel].filter(Boolean).join(' · '));
      } else {
        isLive = false;
        liveRecording = null;
        setNowPlaying('', '');
      }

      const resume = getResumePosition(recordingId);
      if (resume > 10 && resume < totalDuration - 30) {
        serverOffset = resume;
        await playHls(`/stream/hls/recording/${recordingId}?offset=${resume}`);
      } else {
        serverOffset = 0;
        await playHls(`/stream/hls/recording/${recordingId}`);
      }
      startLiveStatusPoll();
    }

    function clearActive() {
      saveResumePosition();
      currentRecordingId = null;
      currentChannelId = null;
      document.querySelectorAll('.channel-item, .recording-item').forEach(el => el.classList.remove('active'));
    }

    // Generation counter for stream opens. Rapid switches (channel zapping,
    // watch-state restore racing a click) can leave two playHls calls in
    // flight; the stale one must abort instead of polling a dead playlist
    // and clobbering the winner's player.
    let playGen = 0;

    // Stop the previous server-side transcode session. Without this, every
    // stream switch leaves the old ffmpeg running (and a live channel holds
    // its Tablo watch session) until the 5-min inactivity reaper fires —
