    // channel surfing briefly stacks up hardware-encode sessions.
    function releaseSession() {
      const sid = currentSessionId;
      currentSessionId = null;
      if (sid) fetch('/api/stop/' + sid, { method: 'POST' }).catch(() => {});
    }

    // Re-open the current stream after the server-side session expired.
    // Position is preserved via serverOffset + video.currentTime (the
    // absolute offset within the recording / channel timeline).
    let recovering = false;
    async function recoverExpiredSession() {
      if (recovering) return;
      recovering = true;
      try {
        const v = document.getElementById('video');
        const pos = serverOffset + (v.currentTime || 0);
        console.log('[hls.js] Server session expired — re-opening at', pos);
        if (currentRecordingId) {
          await playRecordingAtOffset(currentRecordingId, pos);
        } else if (currentChannelId) {
          await playHls(`/stream/hls/channel/${currentChannelId}`);
        }
      } finally {
        setTimeout(() => { recovering = false; }, 3000);
      }
    }

    // ---------- Live-recording lifecycle ----------
    // While watching an in-progress recording, poll its capture state so the
    // player reacts when the capture ends — whether it ended on schedule, was
    // stopped from this UI, or was stopped/canceled elsewhere. Without this
    // the timeline grows on wall-clock forever and the LIVE chip lies.
    let liveStatusTimer = null;

    function startLiveStatusPoll() {
      stopLiveStatusPoll();
      if (liveRecording) liveStatusTimer = setInterval(checkLiveRecordingStatus, 10000);
    }
    function stopLiveStatusPoll() {
      if (liveStatusTimer) { clearInterval(liveStatusTimer); liveStatusTimer = null; }
    }

    async function checkLiveRecordingStatus() {
      if (!liveRecording) { stopLiveStatusPoll(); return; }
      try {
        const res = await fetch(`/api/recording/${liveRecording.id}/status`);
        if (!res.ok) return;
        const s = await res.json();
        if (s.state && s.state !== 'recording') endLiveWatch(s);
      } catch {}
    }

    // The capture behind the stream we're watching has ended. Two intents:
    //  - user picked a CHANNEL (currentChannelId set) and is near the live
    //    edge: they're watching TV — reopen the direct channel stream so
    //    live playback continues into the next show.
    //  - user picked the RECORDING (or has rewound): flip the player to
    //    plain VOD of what was captured; they keep watching, the timeline
    //    freezes at the real end, the LIVE chip goes away.
    function endLiveWatch(status) {
      stopLiveStatusPoll();
      const rec = liveRecording;
      if (!rec) return;
      // Sync the cached list entry so re-renders (and playChannel's
      // in-progress match) see the capture as over.
      const cached = recordings.find(r => String(r.id) === String(rec.id));
      if (cached && cached.state !== 'finished') cached.state = status?.state || 'finished';
      if (cached && status?.recordedDuration) cached.recordedDuration = status.recordedDuration;

      const t = getTimeline();
      const nearLive = t.edge != null && (t.edge - t.pos) < 60;
      liveRecording = null;

      if (currentChannelId != null && nearLive) {
        showToast('Recording ended — continuing live');
        const el = document.querySelector(`.channel-item[data-id="${currentChannelId}"]`);
        playChannel(currentChannelId, el);
        return;
      }

      isLive = false;
      totalDuration = (status?.recordedDuration)
        || (cached && cached.recordedDuration)
        || Math.max(0, serverOffset + (video.duration || 0))
        || rec.duration;
      updateRecBtn();
      updateControls();
      if (currentTab === 'recordings') renderRecordings();
      showToast('Recording ended');
    }

    // Tear the player down to the idle state (used when the recording being
    // watched is deleted out from under us).
    function stopPlayback() {
      stopLiveStatusPoll();
      releaseSession();
      currentRecordingId = null;
      currentChannelId = null;
      isLive = false;
      isLocal = false;
      liveRecording = null;
      currentShowId = null;
      freshVideo();   // blank element, drops src and any hls.js instance
      document.getElementById('controls').classList.remove('visible');
      document.body.classList.remove('has-stream');
      document.getElementById('status').classList.remove('hidden');
      setNowPlaying('', '');
      updateRecBtn();
      document.querySelectorAll('.channel-item, .recording-item').forEach(el => el.classList.remove('active'));
    }

    function setLoading(text) {
      const loading = document.getElementById('loading');
      document.getElementById('loadingText').textContent = text;
      loading.classList.remove('hidden');
    }
    function hideLoading() {
      const loading = document.getElementById('loading');
      loading.classList.add('hidden');
      document.getElementById('loadingText').textContent = 'Loading stream...';
    }

    async function playHls(endpoint) {
      const video = document.getElementById('video');
      const status = document.getElementById('status');
      const loading = document.getElementById('loading');

      status.classList.add('hidden');
      setLoading('Loading stream...');
      clearError();

      if (hls) {
        hls.destroy();
        hls = null;
      }
      releaseSession();
      const gen = ++playGen;

      try {
        const res = await fetch(endpoint);
        const data = await res.json();
        if (data.error) {
          hideLoading();
          showError(data.error);
          return;
        }
        if (gen !== playGen) {
          // A newer open superseded us — kill the session we just created
          fetch('/api/stop/' + data.sessionId, { method: 'POST' }).catch(() => {});
          return;
        }

        currentSessionId = data.sessionId;
        const playlistUrl = data.url;

        setLoading('Preparing stream...');
        await waitForPlaylist(playlistUrl, gen);
        if (gen !== playGen) return;

        loadHls(playlistUrl, video, loading);
      } catch (e) {
        if (gen !== playGen) return;
        hideLoading();
        showError('Failed to start stream: ' + e.message);
      }
    }

    function onStreamReady() {
      hideLoading();
      document.getElementById('controls').classList.add('visible');
      document.body.classList.add('has-stream');
      // PiP support is per-element; the video is recreated on each open
      document.getElementById('pipBtn').classList.toggle('hidden-btn', !pipSupported(document.getElementById('video')));
      showUI();
    }

    function loadHls(playlistUrl, _ignoredVideo, loading) {
      // Fresh <video> element each open so iOS native HLS lands at the live
      // edge (a reused element clings to the old position). Also destroys hls.
      const video = freshVideo();

      // A live channel streams a sliding-window LIVE playlist (player tracks
      // the live edge automatically). A recording streams an append-only EVENT
      // playlist where we start at the produced offset.
      const liveChannel = !!currentChannelId && !currentRecordingId;

      if (Hls.isSupported()) {
        hls = new Hls(liveChannel
          ? {
              // Live channel: let hls.js detect the live playlist and start at
              // the live edge (a few segments back), tracking it as it grows.
              maxBufferLength: 30,
              liveSyncDurationCount: 3,
              backBufferLength: 90,
            }
          : {
              maxBufferLength: 30,
              maxMaxBufferLength: 60,
              // EVENT playlist: pin to 0 so a post-seek load starts at the
              // requested offset (serverOffset maps it to the absolute
              // position) rather than hls.js's default live-edge guess.
              startPosition: 0,
              backBufferLength: Infinity,
            });
        hls.loadSource(playlistUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          onStreamReady();
          displayPos = null;
          const lb = document.getElementById('liveBtn');
          if (isLive) {
            lb.classList.remove('hidden');
            lb.classList.add('at-live');
            // Live channel: hls.js already opened at the live edge — nothing to
            // do. In-progress recording (EVENT): jump to the produced edge.
            if (!liveChannel && liveRecording) {
              const recStart = new Date(liveRecording.date).getTime();
              const liveEdge = (Date.now() - recStart) / 1000;
              if (liveEdge - serverOffset >= 30) lb.classList.remove('at-live');
              else video.currentTime = video.duration || 0;
            }
          } else {
            lb.classList.add('hidden');
          }
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          console.error('[hls.js]', data.type, data.details, data.reason || '', data.err || '');
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              console.log('[hls.js] Attempting media error recovery...');
              hls.recoverMediaError();
            } else if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              // 404 on playlist/fragment means the server-side session was
              // cleaned up (keepalive failed — e.g. laptop slept past the
              // inactivity window, or the server restarted). Re-open the
              // stream at the current playback position.
              const status = data.response?.code || data.networkDetails?.status;
              if (status === 404 && (currentRecordingId || currentChannelId)) {
                recoverExpiredSession();
                return;
              }
              // Preserve current position on recovery — startLoad() with no
              // arg falls back to startPosition (0), snapping playback to
              // the start of the playlist.
              console.log('[hls.js] Attempting network error recovery...');
              hls.startLoad(video.currentTime || 0);
            } else {
              showError('Stream error: ' + data.type + ' (' + data.details + ')');
              hideLoading();
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Native HLS (iOS Safari).
        // Unlike hls.js there's no structured error callback — a reaped
        // session or network drop surfaces as a MediaError on the element.
        // Reopen the stream at the current position (recovering flag
        // debounces repeated error events).
        video.addEventListener('error', () => {
          if (currentRecordingId || currentChannelId) recoverExpiredSession();
        });
        video.src = playlistUrl;
        video.addEventListener('loadedmetadata', () => {
          onStreamReady();
          displayPos = null;
          const lb = document.getElementById('liveBtn');
          if (isLive) {
            lb.classList.remove('hidden');
            lb.classList.add('at-live');
            // No seek here: the server positions the playlist start correctly
            // (live edge for a channel, live offset for an in-progress
            // recording), so native HLS opens live. An in-place seek on iOS
            // tends to snap to the DVR-window start instead.
          } else {
            lb.classList.add('hidden');
          }
          video.play().catch(() => {});
        }, { once: true });
      }
    }

    // Seek a <video> to the live edge. We OVERSHOOT past the seekable end
    // rather than seeking to exactly seekable.end: on Safari/iOS, seeking past
    // the end snaps to the live edge AND triggers the player's live resync —
    // seeking to a finite end value can instead leave iOS clamped at the
    // buffered start (the "Live button jumps to the beginning" bug). hls.js and
    // desktop browsers clamp the overshoot back to the seekable end. seekable
    // may be empty right after load, so retry as it populates.
    function seekToLiveEdge(video) {
      const go = () => {
        try {
          const s = video.seekable;
          if (s && s.length) { video.currentTime = s.end(s.length - 1) + 60; return true; }
          if (isFinite(video.duration) && video.duration > 0) { video.currentTime = video.duration + 60; return true; }
        } catch (e) {}
        return false;
      };
      if (go()) return;
      const onReady = () => { if (go()) cleanup(); };
      const cleanup = () => {
        video.removeEventListener('progress', onReady);
        video.removeEventListener('canplay', onReady);
        video.removeEventListener('durationchange', onReady);
      };
      video.addEventListener('progress', onReady);
      video.addEventListener('canplay', onReady);
      video.addEventListener('durationchange', onReady);
      setTimeout(cleanup, 8000);
    }

    // ---------- Unified timeline model ----------
    // One source of truth for the seek bar / time labels / live chip across
    // the three playback modes:
    //   channel  — live channel, sliding DVR window (seekable range)
    //   liveRec  — in-progress recording; timeline grows in real time to the
    //              live edge, position is serverOffset + currentTime
    //   vod      — finished recording, fixed duration
    function getTimeline() {
      const v = video;
      if (isLive && !liveRecording) {
        const sk = v.seekable;
        const start = sk && sk.length ? sk.start(0) : 0;
        const end = sk && sk.length ? sk.end(sk.length - 1) : (isFinite(v.duration) ? v.duration : (v.currentTime || 0));
        let buffered = end;
        try { if (v.buffered.length) buffered = v.buffered.end(v.buffered.length - 1); } catch {}
        return { mode: 'channel', start, end, pos: v.currentTime || 0, edge: end, buffered };
      }
      if (liveRecording) {
        const recStart = new Date(liveRecording.date).getTime();
        const pos = serverOffset + (v.currentTime || 0);
        // Live edge from wall clock, capped at the scheduled length so the
        // bar stops growing once the airing is over (the status poll then
        // flips us to VOD); never behind the playhead.
        let edge = (Date.now() - recStart) / 1000;
        if (liveRecording.duration) edge = Math.min(edge, liveRecording.duration);
        edge = Math.max(0, edge, pos);
        return { mode: 'liveRec', start: 0, end: edge, pos, edge, buffered: serverOffset + (v.duration || 0) };
      }
      const end = Math.max(totalDuration || 0, serverOffset + (v.duration || 0));
      return { mode: 'vod', start: 0, end, pos: serverOffset + (v.currentTime || 0), edge: null, buffered: serverOffset + (v.duration || 0) };
    }

    // ---------- Seeking ----------
    // Three tiers, cheapest first:
    //   1. target inside the playlist produced so far → set currentTime
    //      (hls.js fetches the segment; instant if already buffered)
    //   2. target a little past the produced edge → wait for the transcoder
    //      to get there (it runs several times faster than realtime on a
    //      recording), then set currentTime
    //   3. otherwise → restart the transcode at the target (serverSeek)
    // Rapid skip presses are coalesced into one seek, and the timeline shows
    // the pending target immediately so the bar never looks frozen.
    const SKIP_COALESCE_MS = 300;
    const WAIT_AHEAD_MAX = 45;        // seconds past the produced edge we'll wait for
    const WAIT_TIMEOUT_MS = 8000;     // give up waiting and restart instead
    let skipTarget = null;            // absolute position of a pending coalesced skip
    let skipTimer = null;
    let waitSeek = null;              // { targetLocal, timer, deadline }
    let displayPos = null;            // absolute position to show while a seek is pending
    let serverSeekInFlight = false;   // a transcode restart is underway (video/offset are stale)

    function producedEnd() {
      const v = video;
      return isFinite(v.duration) ? v.duration : 0;
    }

    function transcodeEnded() {
      try {
        const det = hls && hls.levels && hls.levels[hls.currentLevel >= 0 ? hls.currentLevel : 0]?.details;
        return det ? !det.live : false;
      } catch { return false; }
    }

    function cancelWaitSeek() {
      if (!waitSeek) return;
      clearInterval(waitSeek.timer);
      waitSeek = null;
    }

    function clearPendingSeekUI() {
      displayPos = null;
      updateControls();
    }

    // Seek relative (skip +/- seconds)
    function seekTo(delta) {
      showUI();
      const v = document.getElementById('video');
      if (isLocal) {
        // Local MP4: the browser seeks anywhere natively — no server round-trip
        const dur = isFinite(v.duration) ? v.duration : (totalDuration || Infinity);
        v.currentTime = Math.max(0, Math.min(dur - 0.25, (v.currentTime || 0) + delta));
        return;
      }
      const t = getTimeline();
      // Chain off whatever seek is already pending so +10 +10 +10 = +30.
      // While a seek is in flight the video/offset are stale, so the
      // displayed (pending) position is the truth.
      const base = skipTarget != null ? skipTarget
        : waitSeek ? serverOffset + waitSeek.targetLocal
        : displayPos != null ? displayPos
        : t.pos;

      let maxPos = totalDuration || Infinity;
      if (liveRecording) maxPos = t.edge - 5;
      if (t.mode === 'channel') maxPos = t.end;

      skipTarget = Math.max(t.start, Math.min(maxPos, base + delta));
      displayPos = skipTarget;
      updateControls();

      clearTimeout(skipTimer);
      const gen = playGen;
      skipTimer = setTimeout(() => {
        const target = skipTarget;
        skipTarget = null;
        skipTimer = null;
        if (gen !== playGen) { clearPendingSeekUI(); return; }   // stream changed meanwhile
        seekAbsolute(target);
      }, SKIP_COALESCE_MS);
    }

    // Seek to an absolute position (seconds into the recording, or into the
    // DVR window for a live channel), picking the cheapest tier that works.
    function seekAbsolute(targetAbsolute) {
      const v = video;
      cancelWaitSeek();

      if (isLive && !liveRecording) {
        // Live channel: seek within the DVR window only
        const t = getTimeline();
        v.currentTime = Math.max(t.start, Math.min(targetAbsolute, t.end - 0.5));
        clearPendingSeekUI();
        return;
      }

      if (serverSeekInFlight) {
        // The old playlist is gone and the new one isn't up yet — nothing to
        // seek within; the server supersedes the in-flight restart.
        serverSeek(targetAbsolute);
        return;
      }

      const targetLocal = targetAbsolute - serverOffset;
      const produced = producedEnd();

      if (targetLocal >= 0 && targetLocal <= produced) {
        // Tier 1: within what the transcoder has produced for this session
        v.currentTime = Math.min(targetLocal, Math.max(0, produced - 0.25));
        clearPendingSeekUI();
        return;
      }

      const ahead = targetLocal - produced;
      if (targetLocal >= 0 && ahead > 0 && ahead <= WAIT_AHEAD_MAX && !transcodeEnded() && currentSessionId) {
        // Tier 2: just past the produced edge — wait for it rather than
        // tearing down ffmpeg (a restart costs more than the wait).
        startWaitSeek(targetLocal, targetAbsolute);
        return;
      }

      if (transcodeEnded() && targetLocal > produced) {
        // Whole recording is produced; clamp to its end
        v.currentTime = Math.max(0, produced - 0.5);
        clearPendingSeekUI();
        return;
      }

      // Tier 3: restart the transcode at the target
      serverSeek(targetAbsolute);
    }

    // Read how much the transcoder has produced straight from the session
    // playlist. hls.js only re-reads an EVENT playlist every few seconds, so
    // video.duration lags well behind the real produced edge.
    async function fetchProduced(sessionId) {
      const res = await fetch(`/hls/${sessionId}/stream.m3u8?w=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error('playlist ' + res.status);
      const text = await res.text();
      let total = 0;
      for (const m of text.matchAll(/^#EXTINF:([0-9.]+)/gm)) total += parseFloat(m[1]);
      return { produced: total, ended: /^#EXT-X-ENDLIST/m.test(text) };
    }

    function startWaitSeek(targetLocal, targetAbsolute) {
      const v = video;
      const sid = currentSessionId;
      displayPos = targetAbsolute;
      setLoading('Skipping ahead...');
      const wasPlaying = !v.paused;
      v.pause();
      const t0 = Date.now();
      const deadline = t0 + WAIT_TIMEOUT_MS;
      const gen = playGen;
      const samples = [];   // [{t, produced}] to estimate the transcoder's rate
      let busy = false;
      waitSeek = { targetLocal, deadline, timer: null };

      const finish = (pos) => {
        cancelWaitSeek();
        try {
          // Make hls.js re-read the playlist now instead of on its own
          // schedule, so the seek lands without a multi-second stall.
          if (hls) { hls.stopLoad(); hls.startLoad(pos); }
        } catch {}
        const apply = () => {
          v.currentTime = pos;
          hideLoading();
          clearPendingSeekUI();
          if (wasPlaying) v.play().catch(() => {});
        };
        // The media element clamps currentTime to its current duration, which
        // hls.js only extends once it has parsed the refreshed playlist — so
        // hold the seek until the duration covers the target.
        if (isFinite(v.duration) && v.duration >= pos) { apply(); return; }
        let n = 0;
        const iv = setInterval(() => {
          if (gen !== playGen) { clearInterval(iv); return; }
          if ((isFinite(v.duration) && v.duration >= pos) || ++n > 25) { clearInterval(iv); apply(); }
        }, 200);
      };
      const bail = () => {
        cancelWaitSeek();
        serverSeek(serverOffset + targetLocal);
      };

      const tick = async () => {
        if (!waitSeek || gen !== playGen) { cancelWaitSeek(); return; }
        if (busy) return;
        busy = true;
        try {
          const { produced, ended } = await fetchProduced(sid);
          if (!waitSeek || gen !== playGen) return;
          if (produced >= targetLocal + 0.5) { finish(targetLocal); return; }
          if (ended) { finish(Math.max(0, produced - 0.5)); return; }
          const now = Date.now();
          samples.push({ t: now, produced });
          const first = samples[0];
          const elapsed = (now - first.t) / 1000;
          if (elapsed >= 1.5) {
            // Enough samples to judge: if the transcoder won't reach the
            // target soon, a restart is cheaper than waiting.
            const rate = (produced - first.produced) / elapsed;   // produced seconds per wall second
            const remaining = targetLocal + 0.5 - produced;
            const eta = rate > 0.05 ? remaining / rate : Infinity;
            if (eta > 6) { bail(); return; }
          }
          if (now > deadline) bail();
        } catch {
          if (waitSeek && Date.now() > deadline) bail();
        } finally {
          busy = false;
        }
      };
      waitSeek.timer = setInterval(tick, 400);
      tick();
    }

    // Seek to absolute position in the recording
    async function serverSeek(absoluteSeconds) {
      if (!currentSessionId) return;

      cancelWaitSeek();
      displayPos = absoluteSeconds;
      updateControls();
      setLoading('Seeking...');

      if (hls) { hls.destroy(); hls = null; }
      const gen = ++playGen;
      serverSeekInFlight = true;

      try {
        const res = await fetch(`/api/seek/${currentSessionId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ offset: absoluteSeconds }),
        });
        const data = await res.json();
        if (gen !== playGen) return;
        if (data.superseded) return;   // a newer seek of ours is in flight
        if (data.error) throw new Error(data.error);
        serverOffset = data.startOffset;

        await waitForPlaylist(data.url, gen);
        if (gen !== playGen) return;
        serverSeekInFlight = false;
        loadHls(data.url, document.getElementById('video'), document.getElementById('loading'));
      } catch (e) {
        if (gen !== playGen) return;
        serverSeekInFlight = false;
        hideLoading();
        clearPendingSeekUI();
        showError('Seek failed: ' + e.message);
      } finally {
        // Only the newest seek owns the flag
        if (gen === playGen && serverSeekInFlight && !hls) serverSeekInFlight = false;
      }
    }

    function togglePlay() {
      const v = document.getElementById('video');
      v.paused ? v.play() : v.pause();
    }

    function goLive() {
      showUI();
      if (liveRecording) {
        // In-progress recording: restart the transcode at the live offset. The
        // new session's playlist begins there, so it opens live on every
        // engine (no fragile in-place seek).
        const recStart = new Date(liveRecording.date).getTime();
        const liveOffset = Math.max(0, (Date.now() - recStart) / 1000 - 5);
        clearTimeout(skipTimer); skipTimer = null; skipTarget = null;
        seekAbsolute(liveOffset);
        return;
      }
      // Seek to the live edge of BUFFERED data — the only forward seek iOS
      // native HLS honors. Seeking to the unbuffered seekable.end (or
      // reopening) snaps to the DVR-window start. This is exactly what the
      // working +60s skip does (it clamps to buffered.end - 0.5).
      const v = document.getElementById('video');
      document.getElementById('liveBtn').classList.add('at-live');
      if (v.buffered.length) {
        v.currentTime = v.buffered.end(v.buffered.length - 1) - 0.5;
      } else if (hls) {
        seekToLiveEdge(v);
      }
      v.play().catch(() => {});
    }

    let savedVolume = 1;

    function toggleMute() {
      const v = document.getElementById('video');
      if (v.muted || v.volume === 0) {
        v.muted = false;
        v.volume = savedVolume || 1;
      } else {
        savedVolume = v.volume;
        v.muted = true;
      }
      updateVolumeUI();
    }

    function setVolume(val) {
      const v = document.getElementById('video');
      v.volume = parseFloat(val);
      v.muted = val == 0;
      updateVolumeUI();
    }

    function updateVolumeUI() {
      const v = document.getElementById('video');
      const btn = document.getElementById('muteBtn');
      const slider = document.getElementById('volumeSlider');
      const vol = v.muted ? 0 : v.volume;
      slider.value = vol;
      btn.classList.toggle('muted', vol === 0);
    }

    function isFullscreen() {
      return document.fullscreenElement || document.webkitFullscreenElement;
    }

    function toggleFullscreen() {
      const v = document.getElementById('video');
      if (isFullscreen()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        // iOS Safari (iPhone) exposes only the native video fullscreen API —
        // elements have no requestFullscreen/webkitRequestFullscreen there.
        if (!v.requestFullscreen && !v.webkitRequestFullscreen && v.webkitEnterFullscreen) {
          v.webkitEnterFullscreen();
          return;
        }
        // Fullscreen the player area so our custom overlay controls stay
        // available (video-element fullscreen would show native controls only).
        const pa = document.querySelector('.player-area');
        const fn = pa.requestFullscreen || pa.webkitRequestFullscreen;
        if (fn) {
          fn.call(pa).catch(err => {
            console.warn('[fullscreen] Failed:', err);
            const fn2 = v.requestFullscreen || v.webkitRequestFullscreen;
            if (fn2) fn2.call(v).catch(() => {});
          });
        }
      }
    }

    // AirPlay (Safari-only API). Availability events are bound per video
    // element in bindVideoListeners; the button only appears when a target
    // (Apple TV etc.) is actually reachable.
    function showAirplayPicker() {
      const v = document.getElementById('video');
      if (v.webkitShowPlaybackTargetPicker) v.webkitShowPlaybackTargetPicker();
    }

    // Picture-in-Picture: floating video that keeps playing across app
    // switches. iOS Safari uses the webkit presentation-mode API; desktop
    // browsers use the standard one. Must be called from a user gesture.
    function pipSupported(v) {
      if (typeof v.webkitSetPresentationMode === 'function'
          && typeof v.webkitSupportsPresentationMode === 'function'
          && v.webkitSupportsPresentationMode('picture-in-picture')) return true;
      return !!(document.pictureInPictureEnabled && v.requestPictureInPicture);
    }

    function togglePip() {
      const v = document.getElementById('video');
      if (typeof v.webkitSetPresentationMode === 'function') {
        v.webkitSetPresentationMode(
          v.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture'
        );
        return;
      }
      if (document.pictureInPictureElement) {
        document.exitPictureInPicture().catch(() => {});
      } else if (v.requestPictureInPicture) {
        v.requestPictureInPicture().catch((e) => showError('Picture-in-Picture failed: ' + e.message));
      }
    }

    function toggleTheater() {
      document.body.classList.toggle('theater');
    }

    // Update fullscreen button icon
    function onFullscreenChange() {
      document.getElementById('fullscreenBtn').classList.toggle('fs', !!isFullscreen());
      // Exit theater when entering fullscreen so they feel different
      if (isFullscreen() && document.body.classList.contains('theater')) {
        document.body.classList.remove('theater');
      }
    }
    document.addEventListener('fullscreenchange', onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);

    function fmt(s) {
      if (!isFinite(s) || s < 0) return '0:00';
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = Math.floor(s % 60);
      if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
      return m + ':' + String(sec).padStart(2, '0');
    }

    // ---------- Auto-hide overlay controls ----------
    const playerArea = document.getElementById('playerArea');
    let uiHideTimer = null;

    function showUI() {
      playerArea.classList.remove('hide-ui');
      scheduleHideUI();
    }
    function hideUI() {
      const v = document.getElementById('video');
      if (v.paused || scrubbing) return;   // keep controls while paused/scrubbing
      playerArea.classList.add('hide-ui');
    }
    function scheduleHideUI() {
      clearTimeout(uiHideTimer);
      uiHideTimer = setTimeout(hideUI, 3000);
    }
    playerArea.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'mouse') showUI();
    });
    playerArea.addEventListener('pointerdown', (e) => {
      // Any interaction with the controls keeps them visible a while longer
      if (e.target.closest('.player-top') || e.target.closest('.player-bottom')) showUI();
    });

    // All persistent <video> listeners, bundled so they can be re-bound when
    // the element is recreated (see freshVideo).
    const bufSpinner = document.getElementById('buffering');
    function bindVideoListeners(el) {
      el.addEventListener('timeupdate', updateControls);
      el.addEventListener('play', () => {
        document.getElementById('playpause').classList.add('playing');
        scheduleHideUI();
      });
      el.addEventListener('pause', () => {
        document.getElementById('playpause').classList.remove('playing');
        playerArea.classList.remove('hide-ui');
        clearTimeout(uiHideTimer);
      });
      el.addEventListener('waiting', () => bufSpinner.classList.add('visible'));
      el.addEventListener('playing', () => bufSpinner.classList.remove('visible'));
      el.addEventListener('seeked', () => bufSpinner.classList.remove('visible'));
      el.addEventListener('canplay', () => bufSpinner.classList.remove('visible'));
      el.addEventListener('volumechange', updateVolumeUI);
      if (window.WebKitPlaybackTargetAvailabilityEvent) {
        el.addEventListener('webkitplaybacktargetavailabilitychanged', (e) => {
          document.getElementById('airplayBtn').classList.toggle('hidden-btn', e.availability !== 'available');
        });
      }
      if (isTouch) {
        // Touch: tap the video toggles the control overlay (like YouTube)
        el.addEventListener('click', () => {
          if (playerArea.classList.contains('hide-ui')) showUI();
          else hideUI();
        });
      } else {
        // Mouse: click = play/pause, double-click = fullscreen
        el.addEventListener('click', () => { togglePlay(); showUI(); });
        el.addEventListener('dblclick', toggleFullscreen);
      }
    }

    // Update seek bar and time display
    let video = document.getElementById('video');
    bindVideoListeners(video);
    setInterval(updateControls, 1000);  // also update while paused (live buffer grows)

    // Swap in a brand-new <video> element (re-binding listeners) and return it.
    // iOS native HLS does NOT reset to the live edge when a <video> element is
    // reused — it clings to the old position, which is why a channel switch or
    // the Live button kept landing at the start of the DVR window while a full
    // page reload always went live. Recreating the element per stream open
    // reproduces the page-reload behavior. Also tears down any hls.js instance.
    function freshVideo() {
      if (hls) { hls.destroy(); hls = null; }
      const old = document.getElementById('video');
      const fresh = document.createElement('video');
      fresh.id = 'video';
      fresh.autoplay = true;
      fresh.setAttribute('playsinline', '');
      fresh.setAttribute('webkit-playsinline', '');
      fresh.muted = old.muted;
      fresh.volume = old.volume;
      old.replaceWith(fresh);
      bindVideoListeners(fresh);
      video = fresh;
      return fresh;
    }

    function updateControls() {
      const t = getTimeline();
      const lb = document.getElementById('liveBtn');
      const span = Math.max(0, t.end - t.start);
      const current = Math.max(0, (displayPos != null ? displayPos : t.pos) - t.start);

      document.getElementById('timeTotal').textContent = fmt(span);

      if (!scrubbing) {
        document.getElementById('timeCurrent').textContent = fmt(current);
        const pct = span > 0 ? Math.min(100, (current / span) * 100) : 0;
        document.getElementById('seekFill').style.width = pct + '%';
        document.getElementById('seekThumb').style.left = pct + '%';
        const bufPct = span > 0 ? Math.min(100, ((t.buffered - t.start) / span) * 100) : 0;
        document.getElementById('seekBuffered').style.width = Math.max(0, bufPct) + '%';
      }

      // Chip visibility follows the playback mode so a live→VOD transition
      // (capture ended while watching) hides it without a stream reload.
      if (document.getElementById('controls').classList.contains('visible')) {
        lb.classList.toggle('hidden', t.edge == null);
      }
      if (t.edge != null) {
        const lag = t.edge - t.pos;
        lb.classList.toggle('at-live', lag < (t.mode === 'channel' ? 30 : 15));
      }
    }

    // ---------- Seek bar scrubbing (pointer events: mouse + touch) ----------
    const seekWrap = document.getElementById('seekWrap');
    const seekBubble = document.getElementById('seekBubble');
    let scrubbing = false;

    function scrubFraction(e) {
      const rect = seekWrap.getBoundingClientRect();
      return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    }

    function updateScrubUI(pct) {
      const t = getTimeline();
      const span = Math.max(0, t.end - t.start);
      document.getElementById('seekFill').style.width = (pct * 100) + '%';
      document.getElementById('seekThumb').style.left = (pct * 100) + '%';
      seekBubble.style.left = (pct * 100) + '%';
      seekBubble.textContent = fmt(pct * span);
      seekBubble.classList.add('visible');
      document.getElementById('timeCurrent').textContent = fmt(pct * span);
    }

    function commitSeek(pct) {
      const t = getTimeline();
      if (isLocal) {
        // Local MP4: direct native seek
        const dur = isFinite(video.duration) ? video.duration : t.end;
        video.currentTime = Math.max(0, Math.min(dur - 0.25, pct * t.end));
        return;
      }
      if (t.mode === 'channel') {
        // Live channel: seek within the DVR window (the seekable range).
        video.currentTime = t.start + pct * Math.max(0, t.end - t.start);
        return;
      }
      let target = pct * t.end;
      // Clamp to just behind the live edge for an in-progress recording
      if (t.mode === 'liveRec') target = Math.min(target, t.edge - 5);
      target = Math.max(0, target);
      // Drop any coalesced skip still pending — the bar wins
      clearTimeout(skipTimer); skipTimer = null; skipTarget = null;
      displayPos = target;
      updateControls();
      seekAbsolute(target);
    }

    seekWrap.addEventListener('pointerdown', (e) => {
      if (!document.getElementById('controls').classList.contains('visible')) return;
      scrubbing = true;
      seekWrap.classList.add('scrubbing');
      seekWrap.setPointerCapture(e.pointerId);
      updateScrubUI(scrubFraction(e));
      e.preventDefault();
    });
    seekWrap.addEventListener('pointermove', (e) => {
      if (scrubbing) {
        updateScrubUI(scrubFraction(e));
        showUI();
      } else if (e.pointerType === 'mouse') {
        // Hover preview bubble
        const t = getTimeline();
        const pct = scrubFraction(e);
        seekBubble.style.left = (pct * 100) + '%';
        seekBubble.textContent = fmt(pct * Math.max(0, t.end - t.start));
        seekBubble.classList.add('visible');
      }
    });
    seekWrap.addEventListener('pointerup', (e) => {
      if (!scrubbing) return;
      scrubbing = false;
      seekWrap.classList.remove('scrubbing');
      seekBubble.classList.remove('visible');
      commitSeek(scrubFraction(e));
      showUI();
    });
    seekWrap.addEventListener('pointercancel', () => {
      scrubbing = false;
      seekWrap.classList.remove('scrubbing');
      seekBubble.classList.remove('visible');
    });
    seekWrap.addEventListener('pointerleave', () => {
      if (!scrubbing) seekBubble.classList.remove('visible');
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      switch (e.key) {
        case ' ': e.preventDefault(); togglePlay(); showUI(); break;
        case 'ArrowLeft': e.preventDefault(); seekTo(-10); break;
        case 'ArrowRight': e.preventDefault(); seekTo(10); break;
        case 'j': seekTo(-10); break;
        case 'l': seekTo(10); break;
        case 'k': togglePlay(); showUI(); break;
        case 'f': toggleFullscreen(); break;
        case 't': toggleTheater(); break;
        case 'm': toggleMute(); break;
        case 'Escape': if (document.body.classList.contains('theater')) { document.body.classList.remove('theater'); e.preventDefault(); } break;
      }
    });

    async function waitForPlaylist(url, gen, maxWait = 15000) {
      const start = Date.now();
      while (Date.now() - start < maxWait) {
        if (gen !== undefined && gen !== playGen) return false;  // superseded by a newer open
        try {
          const res = await fetch(url);
          if (res.ok) {
            const text = await res.text();
            if (text.includes('#EXTINF')) return true;
          }
        } catch {}
        await new Promise(r => setTimeout(r, 500));
      }
      return false;
    }

    let errorTimer = null;
    function showToast(msg, kind = 'info') {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.toggle('info', kind === 'info');
      el.classList.add('visible');
      clearTimeout(errorTimer);
      errorTimer = setTimeout(() => el.classList.remove('visible'), kind === 'info' ? 4000 : 8000);
    }
    function showError(msg) {
      showToast(msg, 'error');
    }
    function clearError() {
      const el = document.getElementById('error');
      el.textContent = '';
      el.classList.remove('visible');
      clearTimeout(errorTimer);
    }

    let pickerSelection = new Set();

    function openChannelPicker() {
      pickerSelection = new Set(favorites);
      const list = document.getElementById('modalList');
      list.innerHTML = channels.map(ch => {
        const checked = pickerSelection.has(ch.id) ? 'checked' : '';
        const search = `${ch.number} ${ch.name} ${ch.callSign}`.toLowerCase();
        return `<label class="modal-ch" data-search="${esc(search)}">
          <input type="checkbox" value="${esc(ch.id)}" ${checked} onchange="togglePicker(this)">
          <span class="ch-num">${esc(ch.number)}</span>
          <span>${esc(ch.name)}</span>
        </label>`;
      }).join('');
      document.getElementById('modalSearch').value = '';
      document.getElementById('channelModal').classList.add('open');
    }

    function closeChannelPicker() {
      document.getElementById('channelModal').classList.remove('open');
    }

    function filterModal() {
      const q = document.getElementById('modalSearch').value.toLowerCase();
      for (const el of document.getElementById('modalList').children) {
        const text = el.getAttribute('data-search') || '';
        el.style.display = text.includes(q) ? '' : 'none';
      }
    }

    function togglePicker(cb) {
      if (cb.checked) pickerSelection.add(cb.value);
      else pickerSelection.delete(cb.value);
    }

    function selectAllVisible() {
      for (const el of document.getElementById('modalList').children) {
        if (el.style.display === 'none') continue;
        const cb = el.querySelector('input');
        cb.checked = true;
        pickerSelection.add(cb.value);
      }
    }

    function selectNoneVisible() {
      for (const el of document.getElementById('modalList').children) {
        if (el.style.display === 'none') continue;
        const cb = el.querySelector('input');
        cb.checked = false;
        pickerSelection.delete(cb.value);
      }
    }

    async function saveChannelPicker() {
      favorites = [...pickerSelection];
      await fetch('/api/favorites', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(favorites),
      });
      renderChannels();
      closeChannelPicker();
    }

    // --- Guide / EPG ---
    const GUIDE_PX_PER_MIN = 4;
    const GUIDE_WINDOW_HOURS = 4;
    let guideWindowStart = null;

    function escAttr(str) {
      return esc(str).replace(/"/g, '&quot;');
    }

    function renderGuide() {
      if (!guideWindowStart) guideNow();

      const grid = document.getElementById('guideGrid');
      const windowStart = guideWindowStart.getTime();
      const windowEnd = windowStart + GUIDE_WINDOW_HOURS * 3600000;
      const windowMinutes = GUIDE_WINDOW_HOURS * 60;
      const totalWidth = windowMinutes * GUIDE_PX_PER_MIN;

      // Time header
      let timeHtml = '<div class="guide-time-row"><div class="guide-ch-label"></div><div class="guide-programs" style="width:' + totalWidth + 'px">';
      for (let m = 0; m < windowMinutes; m += 30) {
        const t = new Date(windowStart + m * 60000);
        const label = t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        timeHtml += `<div class="guide-time-mark" style="left:${m * GUIDE_PX_PER_MIN}px">${label}</div>`;
      }
      timeHtml += '</div></div>';

      // Now indicator
      const nowMs = Date.now();
      const nowMin = (nowMs - windowStart) / 60000;
      const nowPx = nowMin * GUIDE_PX_PER_MIN;
      const showNowLine = nowMs >= windowStart && nowMs <= windowEnd;

      // Channel rows
      const visible = favorites.length > 0 ? channels.filter(ch => favorites.includes(ch.id)) : channels;
      let rowsHtml = '';

      for (const ch of visible) {
        const airings = guideData[ch.id] || [];
        let progsHtml = '';

        for (const a of airings) {
          const start = new Date(a.datetime).getTime();
          const end = start + (a.duration || 1800) * 1000;
          if (end <= windowStart || start >= windowEnd) continue;

          const visStart = Math.max(start, windowStart);
          const visEnd = Math.min(end, windowEnd);
          const leftMin = (visStart - windowStart) / 60000;
          const widthMin = (visEnd - visStart) / 60000;
          const left = leftMin * GUIDE_PX_PER_MIN;
          const width = widthMin * GUIDE_PX_PER_MIN;

          const isOn = nowMs >= start && nowMs < end;
          const showTitle = a.show?.title || a.title || '';
          const epInfo = a.episode ? `S${a.episode.season?.number || '?'}E${a.episode.episodeNumber || '?'}` : '';
          const tooltip = [showTitle, epInfo, a.description].filter(Boolean).join('\n');

          const showId = a.show?.identifier || '';
          const sEntry = showId ? seriesIndex[showId] : null;
          const seriesScheduled = sEntry && sEntry.schedule !== 'none';
          const airingScheduled = isAiringScheduled(a.datetime, ch.cloudId);
          const isActiveRec = isOn && isChannelRecording(ch.id);
          // Red = will record (or is recording). Amber hollow = the series is
          // scheduled but Tablo is skipping THIS airing (duplicate of another
          // scheduled airing, or a tuner conflict) — clicking offers to record
          // it anyway.
          const skipped = seriesScheduled && !airingScheduled && !isActiveRec && scheduledAirings.length > 0;
          const recActive = airingScheduled || isActiveRec || (seriesScheduled && scheduledAirings.length === 0);
          const recTitle = isActiveRec ? 'Recording now'
            : skipped ? 'Series scheduled, but Tablo is skipping this airing (duplicate or conflict) — click to record it anyway'
            : recActive ? 'Scheduled' : 'Record';
          const recIcon = showId
            ? `<span class="guide-rec-btn${recActive ? ' recording' : skipped ? ' skipped' : ''}" onclick="toggleRecordShow('${escAttr(showId)}', event, '${escAttr(a.datetime)}', '${escAttr(ch.cloudId || '')}')" title="${escAttr(recTitle)}">${skipped ? '&#9675;' : '&#9679;'}</span>`
            : '';

          progsHtml += `<div class="guide-program${isOn ? ' on-now' : ''}" style="left:${left}px;width:${width - 2}px" title="${escAttr(tooltip)}" onclick="playFromGuide('${ch.id}')">
            <div class="guide-prog-text"><span class="guide-prog-title">${esc(showTitle)}</span>${epInfo ? `<span class="guide-prog-ep">${esc(epInfo)}</span>` : ''}</div>${recIcon}
          </div>`;
        }

        rowsHtml += `<div class="guide-row">
          <div class="guide-ch-label"><span class="channel-number">${esc(ch.number)}</span> ${esc(ch.name)}${isChannelRecording(ch.id) ? ' <span class="ch-rec-dot">REC</span>' : ''}</div>
          <div class="guide-programs" style="width:${totalWidth}px">${progsHtml}
            ${showNowLine ? `<div class="guide-now-line" style="left:${nowPx}px"></div>` : ''}
          </div>
        </div>`;
      }

      document.getElementById('guideDate').textContent = guideWindowStart.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
      grid.innerHTML = timeHtml + rowsHtml;
    }

    function guideNow() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - 30);
      now.setMinutes(Math.floor(now.getMinutes() / 30) * 30, 0, 0);
      guideWindowStart = now;
      if (currentTab === 'guide') renderGuide();
    }

    function guideNav(hours) {
      if (!guideWindowStart) guideNow();
      guideWindowStart = new Date(guideWindowStart.getTime() + hours * 3600000);
      renderGuide();
    }

    async function refreshGuide(btn) {
      const orig = btn.textContent;
      btn.textContent = 'Refreshing...';
      btn.disabled = true;
      try {
        await fetch('/api/refresh?guide=1', { method: 'POST' });
        const [gRes, sRes] = await Promise.all([fetch('/api/guide'), fetch('/api/series'), loadScheduledAirings()]);
        guideData = await gRes.json();
        seriesIndex = await sRes.json();
        renderGuide();
      } catch (e) {
        console.warn('Guide refresh failed:', e);
      } finally {
        btn.textContent = orig;
        btn.disabled = false;
      }
    }

    function playFromGuide(channelId) {
      showTab('live');
      const items = document.getElementById('channel-list').children;
      for (const item of items) {
        if (item.dataset.id === channelId) {
          playChannel(channelId, item);
          return;
        }
      }
      playChannel(channelId, null);
    }

    init();
  </script>
</body>
</html>
